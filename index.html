<style>
:root,
.theme-teal{
  /* 默认风格 D：柔和蓝绿圆角 */
  --bg:#eef6f5; --panel:#ffffff; --panel-2:#f3f8f8; --ink:#143a38; --ink-2:#5d7876;
  --line:#d9e9e7; --line-2:#c2d8d5; --brand:#0d9488; --brand-d:#0b7d72; --brand-soft:#cdeae7;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --radius:16px; --shadow:0 1px 3px rgba(13,148,136,.06),0 6px 20px rgba(13,148,136,.07);
  --shadow-lg:0 14px 44px rgba(15,40,38,.18); --sidebar-w:240px;
  --topbar-bg:rgba(255,255,255,.92); --input-bg:#f4faf9;
}
/* 米灰（原风格） */
.theme-mist{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f8fafc; --ink:#1f2937; --ink-2:#6b7280;
  --line:#e5e7eb; --line-2:#d1d5db; --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#dbeafe;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.18); --sidebar-w:240px;
  --topbar-bg:rgba(255,255,255,.92); --input-bg:#f8fafc;
}
/* 暗色护眼 */
.theme-dark{
  --bg:#0f172a; --panel:#1e293b; --panel-2:#243049; --ink:#e6edf3; --ink-2:#94a3b8;
  --line:#334155; --line-2:#475569; --brand:#2dd4bf; --brand-d:#14b8a6; --brand-soft:#134e4a;
  --green:#4ade80; --green-soft:#14321f; --amber:#fbbf24; --amber-soft:#3a2f12;
  --red:#f87171; --red-soft:#3a1d1d; --purple:#c084fc; --purple-soft:#2e1a47;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.55); --sidebar-w:240px;
  --topbar-bg:rgba(15,23,42,.9); --input-bg:#0f172a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
a{color:var(--brand); text-decoration:none}

/* layout */
.app{display:flex; min-height:100vh}
.sidebar{width:var(--sidebar-w); background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40; overflow-y:auto;}
.sidebar .brand{padding:18px 18px 12px; font-weight:700; font-size:17px; color:var(--brand);
  display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line);}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.nav{padding:10px 8px; flex:1}
.nav-group-title{padding:10px 12px 4px; font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.5px}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:var(--ink);
  cursor:pointer; margin:2px 0; user-select:none; transition:.15s; font-size:14px}
.nav-item:hover{background:var(--panel-2)}
.nav-item.active{background:var(--brand-soft); color:var(--brand-d); font-weight:600}
.nav-item .ico{width:20px; text-align:center}
.nav-item .caret{margin-left:auto; transition:.2s}
.nav-item.collapsed .caret{transform:rotate(-90deg)}
.nav-children{margin-left:14px; border-left:1px dashed var(--line-2); padding-left:4px}
.nav-children .nav-item{font-size:13px; padding:7px 10px}
.sidebar .foot{padding:10px 14px; font-size:11px; color:var(--ink-2); border-top:1px solid var(--line)}

.main{margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{position:sticky; top:0; z-index:30; background:var(--topbar-bg);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 18px;
  display:flex; align-items:center; gap:14px}

.tag.p-low{background:var(--green-soft); color:var(--green)}

.tag.stat-done{background:var(--green-soft); color:var(--green)}
.tag.sev-high{background:var(--red-soft); color:var(--red)}
.tag.sev-mid{background:var(--amber-soft); color:var(--amber)}

/* knowledge */

/* 账号多组 / 主题切换 / 密码强度 */

.theme-sel{padding:6px 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--panel); color:var(--ink); font-size:12px; cursor:pointer}

.pw-strength .bar{flex:1; height:6px; border-radius:999px; background:var(--line); overflow:hidden}

/* misc */

.muted{color:var(--ink-2)}

.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; background:var(--panel-2);

.sync-pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line-2); background:var(--panel); white-space:nowrap}

.sync-pill.err{background:var(--red-soft); color:var(--red); border-color:#fecaca} .sync-pill.err .dot{background:var(--red)}

/* responsive */
@media(max-width:1100px){ .dashbar{grid-template-columns:repeat(2,1fr)} .cols-3{grid-template-columns:repeat(2,1fr)} }

}

.tabbar{display:none}

  .modal.wide,.modal.full{width:100%}

    background:var(--panel); border-top:1px solid var(--line); justify-content:space-around; align-items:center;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -2px 14px rgba(0,0,0,.07)}

(function(){

function fmtDate(d){ const x=new Date(d); const p=n=>String(n).padStart(2,'0'); return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); }
function todayKey(){ return fmtDate(new Date()); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function download(name, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板','ok'),()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('已复制','ok');}catch(e){toast('复制失败','err');} ta.remove(); }

const Store={

  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); },

/* ============================ Toast ============================ */
function toast(msg, type){
  const w=$('#toastWrap'); const t=document.createElement('div');
  t.className='toast '+(type||'info'); t.textContent=msg; w.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(8px)'; t.style.transition='.25s'; }, 2600);
  setTimeout(()=>t.remove(), 2900);
}

/* ============================ Modal ============================ */
function openModal(opts){
  const root=$('#modalRoot');
  const ov=document.createElement('div'); ov.className='overlay';
  const m=document.createElement('div'); m.className='modal '+(opts.size||'');
  m.innerHTML='<div class="m-head">'+(opts.title||'')+'<button class="x" title="关闭">✕</button></div>'+
    '<div class="m-body"></div>'+
    (opts.foot!==false?'<div class="m-foot"></div>':'');
  ov.appendChild(m); root.appendChild(ov);
  const body=m.querySelector('.m-body'); const foot=m.querySelector('.m-foot');
  if(typeof opts.body==='string') body.innerHTML=opts.body; else if(opts.body) body.appendChild(opts.body);
  const close=()=>{ ov.remove(); if(opts.onClose) opts.onClose(); };
  m.querySelector('.x').onclick=close;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov && opts.dismiss!==false) close(); });
  if(foot && opts.actions){
    opts.actions.forEach(a=>{
      const b=document.createElement('button');
      b.className='btn '+(a.primary?'primary':a.danger?'danger':'');
      b.textContent=a.label;
      b.onclick=()=>{ if(a.onClick) a.onClick(close); else close(); };
      foot.appendChild(b);
    });
  }
  return { close, body, foot, el:m };
}
function confirmModal(msg, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const m=openModal({
      title:opts.title||'确认操作',
      body:'<p style="margin:0">'+escapeHtml(msg)+'</p>',
      actions:[
        {label:opts.cancel||'取消', onClick:c=>{ c(); resolve(false); }},
        {label:opts.ok||'确定', danger:true, primary:false, onClick:c=>{ c(); resolve(true); }}
      ]
    });
  });
}

/* ============================ 加密层（CDN + 离线降级） ============================ */
const MasterKey={
  get(){ return sessionStorage.getItem('masterKey'); },
  set(k){ sessionStorage.setItem('masterKey', k); },
  clear(){ sessionStorage.removeItem('masterKey'); },
  valid(p){ return p && p.length>=6; },
  /* —— 受信任设备：本机记住主密码，到期前免输 —— */
  _devKey(){
    try{ let k=localStorage.getItem('wbDevKey'); if(!k){ k=CryptoJS.lib.WordArray.random(24).toString(); localStorage.setItem('wbDevKey',k); } return k; }
    catch(e){ return 'wb-fallback'; }
  },
  remember(days, k){
    if(!k) k=this.get(); if(!k) return;   // 优先用显式传入的密码，避免解锁时 sessionStorage 尚未 set 导致空存
    const enc=CryptoJS.AES.encrypt(JSON.stringify({k, exp:Date.now()+days*86400000}), this._devKey()).toString();
    try{ localStorage.setItem('wbTrust', enc); }catch(e){}
  },
  forget(){ try{ localStorage.removeItem('wbTrust'); }catch(e){} },
  tryTrusted(){
    try{ const enc=localStorage.getItem('wbTrust'); if(!enc) return false;
      const o=JSON.parse(CryptoJS.AES.decrypt(enc, this._devKey()).toString(CryptoJS.enc.Utf8));
      if(!o.k || Date.now()>o.exp){ this.forget(); return false; }
      this.set(o.k); return true;
    }catch(e){ return false; }
  },
  ensure(force){
    return new Promise((resolve,reject)=>{
      const existing=this.get();
      if(existing && !force){ return resolve(existing); }
      let val='';
      const body=document.createElement('div');
      body.innerHTML=
        '<div class="field"><label>主密码（用于加密账号/网址，至少 8 位，含大小写+数字+符号更安全）</label>'+
        '<input type="password" id="mk" placeholder="请输入主密码">'+
        '<div class="pw-strength" id="mkStrength"><span class="bar"><i></i></span><span class="txt"></span></div></div>'+
        '<div class="field"><label>确认主密码</label><input type="password" id="mk2" placeholder="再次输入"></div>'+
        '<div class="warn">主密码仅保存在本次会话（sessionStorage），关闭页面后需重新输入；<b>系统不存储明文且无法找回，请牢记。</b></div>';
      const m=openModal({
        title:'设置主密码',
        body, size:'',
        actions:[
          {label:'取消', onClick:c=>{ c(); reject(new Error('cancelled')); }},
          {label:'确定', primary:true, onClick:c=>{
            const a=body.querySelector('#mk').value, b=body.querySelector('#mk2').value;
            if(!MasterKey.valid(a)){ toast('主密码至少 6 位','err'); return; }
            if(a!==b){ toast('两次输入不一致','err'); return; }
            MasterKey.set(a); c(); resolve(a);
          }}
        ]
      });
      const _mk=body.querySelector('#mk'), _st=body.querySelector('#mkStrength');
      if(_mk&&_st){ const _upd=()=>{ const r=evaluatePwd(_mk.value); _st.className='pw-strength '+(r.cls||''); _st.querySelector('.txt').textContent=r.label; }; _mk.addEventListener('input',_upd); _upd(); }
    });
  },
  prompt(){
    return new Promise((resolve,reject)=>{
      const body=document.createElement('div');
      body.innerHTML='<div class="field"><label>主密码</label><input type="password" id="mk" placeholder="请输入主密码解锁">'+
        '<div class="pw-strength" id="mkStrength"><span class="bar"><i></i></span><span class="txt"></span></div></div>'+
        '<label class="remember"><input type="checkbox" id="mkRemember"> 记住此设备（30 天内打开免输主密码）</label>';
      openModal({ title:'解锁加密数据', body, actions:[
        {label:'取消', onClick:c=>{ c(); reject(new Error('cancelled')); }},
        {label:'解锁', primary:true, onClick:c=>{ const el=body.querySelector('#mk'); const v=el?el.value:''; if(!v){toast('请输入密码','err');return;} c(); if(body.querySelector('#mkRemember') && body.querySelector('#mkRemember').checked) MasterKey.remember(30, v); resolve(v); }}
      ]});
      const _mk=body.querySelector('#mk'), _st=body.querySelector('#mkStrength');
      if(_mk&&_st){ const _upd=()=>{ const r=evaluatePwd(_mk.value); _st.className='pw-strength '+(r.cls||''); _st.querySelector('.txt').textContent=r.label; }; _mk.addEventListener('input',_upd); _upd(); }
    });
  }
};
/* 主密码强度评估：返回 {cls:'weak'|'mid'|'strong', label} */
function evaluatePwd(pw){
  if(!pw) return {cls:'', label:''};
  let s=0;
  if(pw.length>=8) s++;
  if(pw.length>=12) s++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if(/\d/.test(pw)) s++;
  if(/[^A-Za-z0-9]/.test(pw)) s++;
  let label, cls;
  if(pw.length<6){ label='太短'; cls='weak'; }
  else if(s<=2){ label='弱'; cls='weak'; }
  else if(s===3){ label='中'; cls='mid'; }
  else if(s===4){ label='强'; cls='strong'; }
  else { label='极强'; cls='strong'; }
  return {cls, label};
}
const Sec={
  async encrypt(plain){
    const key=MasterKey.get();
    if(!key) throw new Error('no master key');
    if(window.CryptoJS) return CryptoJS.AES.encrypt(plain, key).toString();
    return await wcEncrypt(plain, key);
  },
  async decrypt(cipher){
    const key=MasterKey.get();
    if(!key) throw new Error('no master key');
    if(typeof cipher==='string' && cipher.startsWith('WC1:')) return await wcDecrypt(cipher.slice(4), key);
    if(window.CryptoJS) return CryptoJS.AES.decrypt(cipher, key).toString(CryptoJS.enc.Utf8);
    throw new Error('CRYPTO_MISSING');
  }
};
/* 离线降级：WebCrypto AES-GCM-256 + PBKDF2，前缀 WC1: */
function b64u(bytes){ let s=''; const arr=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes); for(let i=0;i<arr.length;i++) s+=String.fromCharCode(arr[i]); return btoa(s); }
function unb64u(b){ const s=atob(b); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function wcEncrypt(plain, pass){
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plain));
  const out=new Uint8Array(16+12+ct.byteLength); out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28);
  return 'WC1:'+b64u(out);
}
async function wcDecrypt(payload, pass){
  const all=unb64u(payload);
  const salt=all.slice(0,16), iv=all.slice(16,28), ct=all.slice(28);
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

/* ============================ 加密集合读写 ============================ */
async function loadEncrypted(key){
  const raw=Store.get(key);
  if(!raw) return [];
  try{ return JSON.parse(await Sec.decrypt(raw)); }
  catch(e){ if(e.message==='CRYPTO_MISSING'){ toast('加密库未加载，请联网后重试','err'); } else { toast('解密失败：主密码可能错误','err'); } return null; }
}
async function saveEncrypted(key, arr){
  const cipher=await Sec.encrypt(JSON.stringify(arr));
  Store.set(key, cipher);
}
async function unlockOrNull(key){
  MasterKey.clear();
  for(;;){
    try{ const v=await MasterKey.prompt(); MasterKey.set(v); }
    catch(e){ return null; }            // 用户取消
    const a=await loadEncrypted(key);
    if(a!==null) return a;              // 解密成功
    MasterKey.clear();
    toast('主密码错误，请重新输入','err');
  }
}

/* ============================ 看板 ============================ */
const state={ view:'home', viewYear:new Date().getFullYear(), viewMonth:new Date().getMonth() };
function isComplete(it){ return it.done===true || (it.progress!=null && it.progress>=100); }
function isPeriodOverdue(it, ds){  // 周期计划是否逾期：周期结束日已过且仍未完成
  if(isComplete(it)) return false;
  return todayKey() > addDays(ds, (it.periodDays||1)-1);
}
function curMonthCopy(it){  // 「每月重复」组取当前年月的那份副本 {ds,item}，用于逾期判定
  const t=todayKey(); const plan=Store.get(KEY.month,{})||{};
  const day=it.repeatDay||+it.ds.split('-')[2];
  const cm=t.slice(0,7)+'-'+String(day).padStart(2,'0');
  const cur=(plan[cm]||[]).find(x=>x.repeatGroup===it.repeatGroup);
  return cur?{ds:cm, item:cur}:null;
}
function periodOverdueOf(it){  // 统一逾期判定：每月重复看当前年月副本，🔁N天 看自身
  if(it.repeatGroup){ const c=curMonthCopy(it); return c?isPeriodOverdue(c.item, c.ds):false; }
  return isPeriodOverdue(it, it.ds);
}
function coveringPeriodItems(ds){  // 「起始日不在当天、但周期跨度覆盖当天且未完成」的 🔁N天 周期计划
  const plan=Store.get(KEY.month,{})||{}; const out=[];
  Object.keys(plan).forEach(d=>{ if(d===ds) return;
    (plan[d]||[]).forEach(it=>{
      const n=it.periodDays||1; if(n<=1 || isComplete(it)) return;
      if(ds>=d && ds<=addDays(d, n-1)) out.push({...it, _srcDs:d});
    });
  });
  return out;
}
function addDays(ds, n){ const a=ds.split('-').map(Number); const dt=new Date(a[0],a[1]-1,a[2]); dt.setDate(dt.getDate()+n); const p=x=>String(x).padStart(2,'0'); return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()); }
function monthItems(y,m){
  const plan=Store.get(KEY.month, {})||{}; const out=[];
  Object.keys(plan).forEach(d=>{ const [yy,mm]=d.split('-').map(Number); if(yy===y && (mm-1)===m) plan[d].forEach(it=>out.push({date:d, ...it})); });
  return out;
}
function refreshDashboard(){
  const todos=Store.get(KEY.todo, [])||[];
  const t=todayKey(); const plan0=Store.get(KEY.month,{})||{};
  const mt=(plan0[t]||[]).filter(it=>(it.periodDays||1)<=1);
  // 今日周期计划：收集今天处于周期内或逾期的周期项，纳入完成率
  let periodTodayDone=0, periodTodayTotal=0;
  Object.keys(plan0).forEach(d=>{ (plan0[d]||[]).forEach(it=>{ const n=it.periodDays||1; if(n>1){
    const end=addDays(d,n-1);
    const inRange=t>=d&&t<=end;
    const overdue=t>end&&!isComplete(it)&&d.slice(0,7)===t.slice(0,7);
    if(inRange||overdue){ periodTodayTotal++; if(isComplete(it)) periodTodayDone++; }
  }});});
  const todoTotal=todos.length+mt.length+periodTodayTotal;
  const todoDone=todos.filter(t=>t.done).length+mt.filter(isComplete).length+periodTodayDone;
  const items=monthItems(state.viewYear, state.viewMonth);
  const mTotal=items.length;
  const mDone=items.filter(isComplete).length;
  const rate=mTotal? Math.round(mDone/mTotal*100):0;
  const bar=$('#dashbar');
  const titles=['今日待办数','今日完成数','月度计划总数','月度完成率'];
  const vals=[todoTotal, todoDone, mTotal, rate+'%'];
  const subs=['共 '+todoTotal+' 项 · 完成 '+todoDone, '完成率 '+(todoTotal?Math.round(todoDone/todoTotal*100):0)+'%', state.viewYear+'年'+(state.viewMonth+1)+'月', '已完成 '+mDone+' / '+mTotal];
  const cls=['c1','c2','c3','c4'];
  bar.innerHTML=titles.map((t,i)=>'<div class="metric '+cls[i]+'"><div class="label">'+t+'</div><div class="value">'+vals[i]+'</div><div class="sub">'+subs[i]+'</div></div>').join('');
  checkBackupReminder();  // 每次刷新看板时也检查是否需要提醒备份
}
function countAllDataItems(){  // 统计所有模块数据总条数
  let n=0;
  try{ n+=(Store.get(KEY.todo,[])||[]).length; }catch(e){}
  try{ const plan=Store.get(KEY.month,{})||{}; Object.values(plan).forEach(a=>n+=a.length); }catch(e){}
  try{ n+=(Store.get(KEY.year,[])||[]).length; }catch(e){}
  try{ n+=(Store.get(KEY.ip,[])||[]).length; }catch(e){}
  try{ n+=(Store.get(KEY.dev,[])||[]).length; }catch(e){}
  try{ n+=(Store.get(KEY.net,[])||[]).length; }catch(e){}
  try{ n+=(Store.get(KEY.know,[])||[]).length; }catch(e){}
  return n;
}
function checkBackupReminder(){
  const n=countAllDataItems();
  const banner=$('#backupBanner');
  if(!banner) return;
  if(n>=30){
    banner.style.display='block';
    banner.innerHTML='⚠️ 已积累 <b>'+n+'</b> 条数据，建议 <a href="#" id="quickExport" style="color:var(--amber);font-weight:700">导出 JSON 备份</a> 以防丢失';
    const a=banner.querySelector('#quickExport');
    if(a) a.onclick=e=>{ e.preventDefault(); exportAllData(); };
  } else { banner.style.display='none'; }
}
function exportAllData(){
  const data={};
  const keys=getSyncKeys();
  keys.forEach(k=>{ try{ const v=Store.get(k,null); if(v!==null && v!==undefined) data[k]=v; }catch(e){} });
  download('工作台备份-'+todayKey()+'.json', JSON.stringify(data,null,2), 'application/json');
  toast('全部数据已导出为 JSON 备份','ok');
}
async function importAllData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const txt=await f.text(); const j=JSON.parse(txt);
      if(!j || typeof j!=='object'){ toast('文件格式不正确','err'); return; }
      if(!(await confirmModal('导入将覆盖本机所有模块的当前数据（加密数据不在此列，请通过同步恢复）。确定继续？',{title:'确认导入备份',ok:'导入'}))) return;
      let count=0;
      Object.keys(j).forEach(k=>{
        if(k.startsWith('encrypted')) return; // 加密数据不入库（走同步恢复）
        Store.set(k, j[k]); count++;
      });
      toast('已导入 '+count+' 个模块的数据，页面即将刷新','ok');
      setTimeout(()=>location.reload(), 800);
    }catch(e){ toast('解析失败：'+((e&&e.message)||''),'err'); }
  };
  inp.click();
}

    };
    nav.appendChild(item);

      const ch=document.createElement('div'); ch.className='nav-children';

        ci.innerHTML='<span class="ico">'+c.ico+'</span><span>'+c.label+'</span>';

function render(){

/* 按钮：返回 HTML 字符串，点击通过全局委托触发回调（避免 innerHTML 拼接 DOM 节点的问题） */
const _cbReg={};

function btn(label, cls, onClick){ return _btnHTML(label, cls, onClick); }

/* ============== 今日待办 ============== */
function activeMonthItems(){ // 今日待办月度项：当月全显示 + 过往未完成（逾期）→ 将来不显示
  const plan=Store.get(KEY.month,{})||{}; const out=[];
  const t=todayKey(); const curMonth=t.slice(0,7);
  Object.keys(plan).forEach(d=> (plan[d]||[]).forEach(it=>{
    if((it.periodDays||1)>1) return;                       // 周期项走「今日周期计划」区块
    const inCur=d.slice(0,7)===curMonth;
    if(!inCur && d>=t) return;                             // 将来不显示
    if(!inCur && isComplete(it)) return;                   // 过往已完成不显示
    if(isComplete(it)){ const ca=it.completedAt?new Date(it.completedAt).getTime():0; if(ca && Date.now()-ca>=2*86400000) return; } // 完成满2天已归档
    out.push({ds:d, ...it});
  }));
  return out;
}
function renderTodo(){
  const view=$('#view');
  const list=Store.get(KEY.todo,[])||[];  // 全部待办：今日正常显示，往期未完成标注逾期
  const monthItems=activeMonthItems();
  view.innerHTML=
    '<div class="view-head"><h2>📋 今日待办</h2><div class="spacer"></div>'+btn('+ 新建','primary',()=>todoEdit(null))+'</div>'+
    '<div class="list" id="todoList"></div>'+
    '<div id="todayPeriod" style="margin-top:18px"></div>';
  const box=$('#todoList');
  const total=list.length+monthItems.length;
  if(!total){ box.innerHTML='<div class="empty">暂无待办，点右上角「新建」开始吧</div>'; }
  else {
    // 排序：逾期未完成置顶（越早越靠前）→ 今日未完成 → 已完成按时间升序
    const t=todayKey();
    const all=[];
    list.forEach(it=>{ const past=it.createdAt&&it.createdAt.slice(0,10)<t&&!it.done; all.push({row:()=>todoRow(it), done:isComplete(it), past, t:it.createdAt||''}); });
    monthItems.forEach(m=>all.push({row:()=>todoRowMonth(m, m.ds), done:isComplete(m), past:false, t:m.createdAt||''}));
    all.sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;        // 未完成置顶
      if(!a.done && a.past!==b.past) return a.past?-1:1;  // 逾期优先
      return a.t<b.t?-1:(a.t>b.t?1:0);                // 时间升序
    });
    all.forEach(x=>box.appendChild(x.row()));
  }
  renderTodayPeriod(); checkArchiveDue();
}
function renderTodayPeriod(){
  const box=$('#todayPeriod'); if(!box) return;
  const t=todayKey();
  const plan=Store.get(KEY.month,{})||{};
  let items=[];
  Object.keys(plan).forEach(d=> (plan[d]||[]).forEach(it=>{ const n=it.periodDays||1; if(n>1){ const end=addDays(d,n-1);
    const inRange = t>=d && t<=end;
    const overdue = t>end && !isComplete(it) && d.slice(0,7)===t.slice(0,7);  // 逾期未完成：在其所属月份内持续提醒
    if(inRange || overdue) items.push({ds:d, end, ...it, overdue});
  } }));
  // 合并「每月重复」组：同一 repeatGroup 只保留一条，避免相邻月份副本重叠时重复显示
  const seen=new Set();
  items=items.filter(it=>{ if(it.repeatGroup){ if(seen.has(it.repeatGroup)) return false; seen.add(it.repeatGroup); return true; } return true; });
  if(!items.length){ box.innerHTML=''; return; }
  let html='<div class="card"><div class="view-head" style="margin:0 0 10px"><h3 style="margin:0">📌 今日周期计划</h3><div class="spacer"></div></div>';
  items.forEach(it=>{
    const total=it.periodDays||1; const elapsed=Math.max(0, Math.ceil((new Date(t)-new Date(it.ds))/86400000)); const pct=Math.min(100, Math.round(elapsed/total*100));
    const repLabel=it.repeatGroup?('🔁每月 · 每月'+(it.repeatDay||+it.ds.split('-')[2])+'号'):('🔁'+total+'天');
    const repMeta=it.repeatGroup?('每月'+(it.repeatDay||+it.ds.split('-')[2])+'号 · 周期'+total+'天'):(it.ds+' ~ '+it.end);
    const odTag = it.overdue ? '<span class="tag p-high">⏰逾期</span>' : '';
    html+='<div class="ditem'+(it.overdue?' overdue':'')+'">'+
      '<div class="top"><span class="tag cat">'+repLabel+'</span>'+
        '<div class="ttl">'+escapeHtml(it.text)+'</div>'+odTag+
        priTag(it.priority||'mid')+(it.category?'<span class="tag cat">'+escapeHtml(it.category)+'</span>':'')+'</div>'+
      '<div class="meta row" style="margin-top:6px"><span class="muted">'+repMeta+'</span>'+
        '<div class="progress" style="flex:1;margin:0 8px"><i style="width:'+pct+'%"></i></div><span class="progress-num">'+(it.overdue?'已逾期':'进行 '+pct+'%')+'</span></div>'+
      '<div class="meta row" style="margin-top:6px">'+opBtn('完成','sm primary',()=>{
          let tds=it.ds, tit=it;
          if(it.repeatGroup){ const c=curMonthCopy(it); if(c){ tds=c.ds; tit=c.item; } else { toast('本月副本已完成或不存在','info'); return; } }
          tit.done=true; tit.progress=100; tit.updatedAt=nowISO(); saveMonthItem(tds, tit); refreshDashboard(); renderTodo();
        })+opBtn('复制','sm',()=>copyMonthToTodo(it))+opBtn('编辑','sm',()=>monthItemEdit(it, it.ds))+
        opBtn('删','sm danger',()=>delMonth(it, it.ds))+'</div>'+
    '</div>';
  });
  html+='</div>'; box.innerHTML=html;
}
function priTag(p){ const m={high:['高','p-high'],mid:['中','p-mid'],low:['低','p-low']}; const x=m[p]||m.mid; return '<span class="tag '+x[1]+'">'+x[0]+'</span>'; }
function todoRow(it){
  const row=document.createElement('div');
  const t=todayKey();
  const past=it.createdAt && it.createdAt.slice(0,10)<t && !it.done;  // 往期未完成 → 逾期
  row.className='item'+(it.done?' done':'')+(past?' overdue':'');

    '<input type="checkbox" class="chk" '+(it.done?'checked':'')+'>'+

      '<div class="meta">'+priTag(it.priority||'mid')+(it.linkId?'<span class="tag cat">已关联月度</span>':'')+
      (past?'<span class="tag p-high">⏰逾期</span>':'')+
      '<span>'+(isToday?'今天':dateLabel)+'</span></div></div>'+
    '<div class="ops">'+opBtn('完成','sm primary',()=>archiveSimpleTodo(it))+opBtn('复制','sm',()=>copyTodoToMonth(it))+opBtn('编辑','sm',()=>todoEdit(it))+opBtn('删','sm danger',()=>delTodo(it))+'</div>';
  row.querySelector('.chk').onchange=e=>{ it.done=e.target.checked; Store.set(KEY.todo, Store.get(KEY.todo,[]).map(x=>x.id===it.id?it:x)); if(it.linkId) syncLinkDone(it); refreshDashboard(); toast('已更新','ok'); };
  return row;

function todoRowMonth(it, ds){
  const row=document.createElement('div');

    '<input type="checkbox" class="chk" '+(isComplete(it)?'checked':'')+'>'+

      '<div class="meta">📅 月度 · '+ds+(overdue?' · ⏰逾期':'')+(it.category?' · '+escapeHtml(it.category):'')+(it.repeat==='monthly'?' · 🔁每月':'')+'</div></div>'+
    '<div class="ops">'+opBtn('完成','sm primary',()=>{it.done=true;it.progress=100;it.completedAt=nowISO();it.updatedAt=nowISO();archiveMonthItem(ds,it);refreshDashboard();renderTodo();})+opBtn('编辑','sm',()=>monthItemEdit(it, ds))+opBtn('去月度','sm',()=>{ const p=ds.split('-'); state.viewYear=+p[0]; state.viewMonth=+p[1]-1; state.selDate=ds; go('month'); })+opBtn('删','sm danger',()=>delMonth(it, ds))+'</div>';
  row.querySelector('.chk').onchange=e=>{ const done=e.target.checked; const obj={...it, done, progress:done?100:(it.progress||0)}; if(done && !it.completedAt) obj.completedAt=nowISO(); saveMonthItem(ds, obj); refreshDashboard(); renderTodo(); };
  return row;

function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function opBtn(label, cls, onClick){ return _btnHTML(label, cls, onClick); }
function isTodayItem(it){  // 判断待办是否属于今天
  if(!it.createdAt) return true;  // 无创建时间的旧数据保留显示
  return it.createdAt.slice(0,10)===todayKey();
}
function archiveSimpleTodo(it){  // 今日待办点击「完成」→ 直接归档到年度回顾
  const year=Store.get(KEY.year,[])||[];

    year.unshift({id:it.id, title:it.text, category:'今日待办', sourceDate:todayKey(), completedAt:nowISO(), subtasks:[], archivedAt:nowISO()});

async function delTodo(it){
  if(await confirmModal('确定删除该待办「'+it.text+'」？')){
    Store.set(KEY.todo, (Store.get(KEY.todo,[])||[]).filter(x=>x.id!==it.id)); refreshDashboard(); renderTodo(); toast('已删除','ok');

function todoEdit(it){

      else { const arr=Store.get(KEY.todo,[]).map(x=>x.id===it.id?{...x,text,priority:$('#t_pri').value}:x); Store.set(KEY.todo,arr); }

function copyTodoToMonth(it){
  const date=prompt('复制到月度计划的日期（YYYY-MM-DD）：', todayKey());
  if(!date) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('日期格式错误','err'); return; }
  const plan=Store.get(KEY.month,{})||{}; const arr=plan[date]||[];
  const newItem={id:uid(), text:it.text, done:it.done, priority:it.priority||'mid', progress:it.done?100:0, category:'待办转入', subtasks:[], createdAt:nowISO(), updatedAt:nowISO(), linkId:it.id};
  arr.push(newItem); plan[date]=arr; Store.set(KEY.month, plan);
  // 双向联动：给待办打上 linkId
  const todos=Store.get(KEY.todo,[]).map(x=>x.id===it.id?{...x, linkId:newItem.id}:x); Store.set(KEY.todo, todos);
  toast('已复制到月度计划 '+date,'ok'); refreshDashboard();
}
function syncLinkDone(src){
  // src 是待办，找到月度中 linkId 对应的项，同步 done
  const plan=Store.get(KEY.month,{})||{};
  Object.keys(plan).forEach(d=>{
    plan[d]=plan[d].map(x=>{ if(x.linkId===src.id){ const nx={...x, done:src.done, progress:src.done?100:x.progress}; return nx; } return x; });
  });
  Store.set(KEY.month, plan);
}



/* ============== 月度计划（核心） ============== */
function renderMonth(){
  const view=$('#view'); const y=state.viewYear, m=state.viewMonth;
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; // 周一为起点
  const days=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate();
  let html='<div class="view-head"><h2>📅 月度计划</h2><div class="spacer"></div>'+
    btn('📝 生成月度总结','',genMonthSummary)+btn('+ 今日添加','primary',()=>monthItemEdit(null, todayKey()))+'</div>';
  html+='<div class="cal-head"><button class="btn sm" id="prevM">‹ 上月</button><span class="mm">'+y+'年'+(m+1)+'月</span><button class="btn sm" id="nextM">下月 ›</button></div>';
  html+='<div class="cal">';
  ['一','二','三','四','五','六','日'].forEach(d=>html+='<div class="dow">'+d+'</div>');
  // 上月补齐
  for(let i=startDow-1;i>=0;i--){ html+='<div class="day other"><div class="dnum">'+(prevDays-i)+'</div></div>'; }
  const plan=Store.get(KEY.month,{})||{};
  const tKey=todayKey();
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const arr=plan[ds]||[]; const done=arr.filter(isComplete).length;
    const rate=arr.length?Math.round(done/arr.length*100):0;
    const dots=arr.slice(0,3).map(it=>'<span class="dot" title="'+escapeHtml(it.text)+'"></span>').join('');
    const mini=arr[0]?('<div class="mini">'+escapeHtml(arr[0].text)+'</div>'):'';
    const hasPeriod=arr.some(it=>(it.periodDays||1)>1);
    const hasMonthly=arr.some(it=>it.repeat==='monthly');
    const cls='day'+(ds===tKey?' today':'')+(state.selDate===ds?' sel':'')+(hasPeriod?' inrange-start':'');
    html+='<div class="'+cls+'" data-date="'+ds+'"><div class="dnum">'+d+(hasPeriod?'<span class="pbadge">🔁</span>':'')+(hasMonthly?'<span class="pbadge">🔁月</span>':'')+'</div>'+mini+
      '<div class="dots">'+dots+(arr.length>3?'<span class="muted" style="font-size:10px">+'+(arr.length-3)+'</span>':'')+'</div>'+
      (arr.length?'<div class="pct">'+rate+'%</div>':'')+'</div>';
  }
  // 下月补齐
  const total=startDow+days; const tail=(7-total%7)%7;
  for(let d=1;d<=tail;d++){ html+='<div class="day other"><div class="dnum">'+d+'</div></div>'; }
  html+='</div>';
  html+='<div id="dayPanel" style="margin-top:16px"></div>';
  html+='<div id="periodPanel" style="margin-top:18px"></div>';
  view.innerHTML=html;
  (function(){ const all=Store.get(KEY.month,{})||{}; Object.keys(all).forEach(d0=>{ (all[d0]||[]).forEach(it=>{ const n=it.periodDays||1; if(n>1){ let cur=d0; const end=addDays(d0,n-1); while(cur<=end){ const p=cur.split('-').map(Number); if(p[0]===y && (p[1]-1)===m){ const cell=view.querySelector('.cal .day[data-date="'+cur+'"]'); if(cell) cell.classList.add('inrange'); } cur=addDays(cur,1); } } }); }); })();
  $('#prevM').onclick=()=>{ if(m===0){state.viewMonth=11;state.viewYear--;}else state.viewMonth--; refreshDashboard(); renderMonth(); };
  $('#nextM').onclick=()=>{ if(m===11){state.viewMonth=0;state.viewYear++;}else state.viewMonth++; refreshDashboard(); renderMonth(); };
  $$('.cal .day[data-date]').forEach(el=>{ el.onclick=()=>{ state.selDate=el.dataset.date; renderMonth(); }; el.ondblclick=e=>{ e.preventDefault(); showDayModal(el.dataset.date); }; });
  if(!state.selDate) state.selDate=todayKey();
  renderDayPanel(state.selDate);
  renderPeriodPanel();
}
function renderPeriodPanel(){
  const panel=$('#periodPanel'); if(!panel) return;
  const plan=Store.get(KEY.month,{})||{};
  let items=[];
  Object.keys(plan).forEach(d=> (plan[d]||[]).forEach(it=>{ if((it.periodDays||1)>1) items.push({ds:d, ...it}); }));
  // 合并「每月重复」组：同一 repeatGroup 只保留最早一条，避免全年 12 份重复列出
  const seen=new Set();
  items=items.filter(it=>{ if(it.repeatGroup){ if(seen.has(it.repeatGroup)) return false; seen.add(it.repeatGroup); return true; } return true; });
  if(!items.length){ panel.innerHTML=''; return; }
  items.sort((a,b)=> a.ds<b.ds?-1:(a.ds>b.ds?1:0));
  const t=todayKey();
  let html='<div class="card"><div class="view-head" style="margin:0 0 10px"><h3 style="margin:0">📌 周期 / 长期计划</h3><div class="spacer"></div><span class="muted">共 '+items.length+' 项（跨月可见）</span></div>';
  items.forEach(it=>{
    const end=addDays(it.ds, (it.periodDays||1)-1);
    const left = t>end ? '已结束' : (t<it.ds ? '未开始' : '剩 '+Math.max(0,Math.ceil((new Date(end)-new Date(t))/86400000))+' 天');
    const repLabel=it.repeatGroup?('🔁每月 · 每月'+(it.repeatDay||+it.ds.split('-')[2])+'号'):('🔁'+(it.periodDays||1)+'天');
    const od=periodOverdueOf(it);  // 逾期：🔁N天 看自身周期末；🔁每月 看当前年月副本
    const repMeta=it.repeatGroup?('全年每月'+(it.repeatDay||+it.ds.split('-')[2])+'号 · 周期'+(it.periodDays||1)+'天'+(od?' · 本月已逾期':'')):(it.ds+' ~ '+end+' · '+(od?'已逾期':left));
    html+='<div class="ditem period-item'+(od?' overdue':'')+'" data-id="'+it.id+'">'+
      '<div class="top"><span class="tag cat">'+repLabel+'</span>'+
        '<div class="ttl">'+escapeHtml(it.text)+'</div>'+(od?'<span class="tag p-high">⏰逾期</span>':'')+
        priTag(it.priority||'mid')+(it.category?'<span class="tag cat">'+escapeHtml(it.category)+'</span>':'')+'</div>'+

function saveMonthItem(ds, it){
  const isCycle=(it.periodDays||1)>1 || it.repeat==='monthly' || it.repeatGroup;  // 周期计划（🔁N天 / 🔁每月）
  if(isCycle && isComplete(it)){  // 周期计划：勾选完成即直接归档，不等待延迟
    if(!it.completedAt) it.completedAt=nowISO();
    archiveMonthItem(ds, it); refreshDashboard(); if(state.view==='month') renderMonth(); return;
  }
  if(isComplete(it) && !it.completedAt) it.completedAt=nowISO();  // 完成时记完成时间（供延迟归档判断）
  const plan=Store.get(KEY.month,{})||{}; const arr=plan[ds]||[];
  const idx=arr.findIndex(x=>x.id===it.id);
  if(idx>=0) arr[idx]=it; else arr.push(it);
  plan[ds]=arr; Store.set(KEY.month, plan);
  // 完成不再立即归档；满2天后由 checkArchiveDue() 自动归档到年度回顾（周期计划则在勾选完成时直接归档）
  refreshDashboard(); renderMonth();
}
function archiveMonthItem(ds, it){
  const arr=Store.get(KEY.year,[])||[];
  if(arr.find(a=>a.id===it.id)) return;
  arr.unshift({id:it.id, title:it.text, category:it.category||'未分类', sourceDate:ds, completedAt:nowISO(), subtasks:it.subtasks||[], archivedAt:nowISO()});
  Store.set(KEY.year, arr);
  // 从月度计划移除
  const plan=Store.get(KEY.month,{})||{}; if(plan[ds]){ plan[ds]=plan[ds].filter(x=>x.id!==it.id); if(!plan[ds].length) delete plan[ds]; Store.set(KEY.month, plan); }
  toast('已完成任务已归档到年度回顾','ok');
}
function checkArchiveDue(){  // 扫描「完成满2天」的月度项，自动归档到年度回顾并从月度移除
  const plan=Store.get(KEY.month,{})||{}; const year=Store.get(KEY.year,[])||[];
  let mChanged=false, yChanged=false;
  Object.keys(plan).forEach(d=>{ const keep=[];
    (plan[d]||[]).forEach(it=>{
      if((it.periodDays||1)>1 || it.repeat==='monthly' || it.repeatGroup) return; // 周期计划在 saveMonthItem 勾选完成时已即时归档
      if(isComplete(it) && it.completedAt && Date.now()-new Date(it.completedAt).getTime()>=2*86400000){
        if(!year.find(a=>a.id===it.id)){ year.unshift({id:it.id, title:it.text, category:it.category||'未分类', sourceDate:d, completedAt:it.completedAt, subtasks:it.subtasks||[], archivedAt:nowISO()}); yChanged=true; }
        mChanged=true;
      } else keep.push(it);
    });
    if(keep.length!==(plan[d]||[]).length){ if(keep.length) plan[d]=keep; else delete plan[d]; }
  });
  if(yChanged) Store.set(KEY.year, year);
  if(mChanged){ Store.set(KEY.month, plan); refreshDashboard(); if(state.view==='month') renderMonth(); }
}
function copyMonthToTodo(it){

  todos.unshift({id:uid(), text:it.text, done:it.done, priority:it.priority||'mid', createdAt:nowISO(), linkId:it.id});
  Store.set(KEY.todo, todos); toast('已复制到今日待办','ok'); refreshDashboard();
}
function removeRepeatGroup(gid){  // 删除某组「每月重复」计划的全部月份副本
  const plan=Store.get(KEY.month,{})||{};
  Object.keys(plan).forEach(d=>{ plan[d]=plan[d].filter(x=>x.repeatGroup!==gid); if(!plan[d].length) delete plan[d]; });
  Store.set(KEY.month, plan);
}
function delMonth(it, ds){

    '<div class="field"><label>重复日（每月几号，1-31）</label><input type="number" id="m_rday" min="1" max="31" value="'+(data.repeatDay||+ds.split('-')[2])+'" style="width:100%"></div>'+
    '<div class="field"><label>子任务（每行一个）</label><textarea id="m_sub">'+escapeHtml((data.subtasks||[]).map(s=>s.text).join('\n'))+'</textarea></div>';
  openModal({ title:isNew?'新建月度任务':'编辑月度任务', body, size:'', actions:[
    {label:'取消', onClick:c=>c()},
    {label:'保存', primary:true, onClick:c=>{
      const text=$('#m_text').value.trim(); if(!text){toast('内容不能为空','err');return;}
      const progress=+$('#m_pro').value;
      const subText=$('#m_sub').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const oldSubs=data.subtasks||[];
      const subtasks=subText.map((t,i)=>oldSubs[i]&&oldSubs[i].text===t?oldSubs[i]:{text:t,done:false});
      const rep=$('#m_rep').value;
      const rday=Math.min(31, Math.max(1, parseInt($('#m_rday').value||'1',10)||1));
      const base={text, done:progress>=100, priority:$('#m_pri').value, progress, category:$('#m_cat').value.trim(), subtasks, periodDays:Math.max(1, parseInt($('#m_days').value||'1',10)||1), createdAt:isNew?nowISO():data.createdAt, updatedAt:nowISO()};
      if(rep==='monthly'){
        // 每月重复：先清除旧组，再按重复日在当年1-12月各生成一份（2月31等自动落到月末）
        if(it && it.repeatGroup){ removeRepeatGroup(it.repeatGroup); }

        refreshDashboard(); renderMonth();
      } else {
        if(it && it.repeatGroup){ removeRepeatGroup(it.repeatGroup); }  // 从「每月重复」改为不重复：清旧组

    }}
  ]});
  const gen=$('#genpw'); gen.onclick=()=>{ $('#a_pw').value=genPassword(+$('#pwlen').value, $('#pw_sym').checked); };

  $('#pwlen').oninput=e=>{ $('#pwlenv').textContent=e.target.value+' 位'; };

function genPassword(len, sym){
  const lower='abcdefghijklmnopqrstuvwxyz', upper=lower.toUpperCase(), num='0123456789', s='!@#$%^&*()-_=+';
  let pool=lower+upper+num; if(sym) pool+=s;
  const arr=new Uint32Array(len); window.crypto.getRandomValues(arr);
  let out=''; for(let i=0;i<len;i++) out+=pool[arr[i]%pool.length];
  return out;
}

}

function renderWeek(){

function buildWeekly(){
  const end=new Date(); const start=new Date(end.getTime()-6*86400000);
  const inRange=iso=>{ const t=new Date(iso).getTime(); return t>=start.getTime() && t<=end.getTime()+86400000; };
  const todos=(Store.get(KEY.todo,[])||[]).filter(t=>t.createdAt&&inRange(t.createdAt));
  const plan=Store.get(KEY.month,{})||{}; let mItems=[];
  Object.keys(plan).forEach(d=>plan[d].forEach(it=>{ if(it.createdAt&&inRange(it.createdAt)||(it.updatedAt&&inRange(it.updatedAt))) mItems.push({date:d, ...it}); }));
  const dev=(Store.get(KEY.dev,[])||[]).filter(d=>d.updatedAt&&inRange(d.updatedAt));
  const net=(Store.get(KEY.net,[])||[]).filter(n=>n.createdAt&&inRange(n.createdAt));
  const know=(Store.get(KEY.know,[])||[]).filter(k=>k.createdAt&&inRange(k.createdAt));
  const L=[];
  L.push('# 工作周报（'+fmtDate(start)+' ~ '+fmtDate(end)+'）');
  L.push('');
  L.push('## 一、今日待办（本周新增 '+todos.length+'）');
  todos.forEach(t=>L.push('- ['+(t.done?'x':' ')+'] '+t.text));
  L.push('');
  L.push('');
  L.push('## 二、月度计划进展（'+mItems.length+'）');
  mItems.forEach(it=>L.push('- '+it.date+' · ['+(isComplete(it)?'x':' ')+'] '+it.text+(it.category?'（'+it.category+'）':'')));
  L.push('');
  L.push('## 三、设备运维（'+dev.length+'）');
  dev.forEach(d=>L.push('- '+escapeHtml(d.deviceName||'')+(d.replacementRecords&&d.replacementRecords.length?('：'+d.replacementRecords.length+' 次更换'):'')));
  L.push('');
  L.push('## 四、网络维护（'+net.length+'）');
  net.forEach(n=>L.push('- '+escapeHtml(n.incidentDate||'')+' · '+escapeHtml(n.cause||'')+'（'+(n.severity==='high'?'严重':n.severity==='low'?'轻微':'一般')+'）'));
  L.push('');
  L.push('## 五、知识沉淀（'+know.length+'）');
  know.forEach(k=>L.push('- '+escapeHtml(k.title||'')));
  L.push('');
  L.push('> 由「个人工作台」自动生成');
  return { range:fmtDate(start)+' ~ '+fmtDate(end), text:L.join('\n') };
}

/* ============================ WebDAV 同步层（坚果云 + 无服务器代理） ============================ */
const SYNC_KEYS=['todayTodos','monthlyPlan','yearlyArchive','ipDevices','encryptedAccounts','encryptedUrls','deviceMaintenance','networkMaintenance','knowledge','encryptedRemote'];
const SYNC_FOLDER='工作台';
const SYNC_META_KEY='wbSyncMeta'; // { [key]: updatedAt }
const SYNC_KEYSET_KEY='wbSyncKeyset'; // 动态登记的同步 key（新增模块自动纳入）
// 不应同步的本地 key：同步配置(含坚果云密码)、同步元数据、动态集合自身
const SYNC_BLACKLIST=new Set([SYNC_META_KEY, SYNC_KEYSET_KEY, 'webdavConfig']);
// 动态登记：业务代码首次 Store.set(key) 时自动加入同步范围，新增模块无需改此处
function registerSyncKey(k){
  if(SYNC_BLACKLIST.has(k)) return;
  const set=Store.get(SYNC_KEYSET_KEY, []) || [];
  if(!set.includes(k)){ set.push(k); localStorage.setItem(SYNC_KEYSET_KEY, JSON.stringify(set)); }
}
// 当前应同步的全部 key = 初始 10 个 + 动态登记，剔除黑名单
function getSyncKeys(){
  const all=new Set([...(Store.get(SYNC_KEYSET_KEY, [])||[]), ...SYNC_KEYS]);
  SYNC_BLACKLIST.forEach(k=>all.delete(k));
  return [...all];
}
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getHours()+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function getSyncMeta(){ return Store.get(SYNC_META_KEY, {}) || {}; }
function setSyncMeta(m){ Store.set(SYNC_META_KEY, m); }

const SyncStatus={
  set(state, detail){
    const pill=$('#syncPill'), pillText=$('#syncPillText'), nav=$('#navStatText'), panel=$('#syncStatus');
    const map={idle:['off','离线'],syncing:['syncing','同步中…'],success:['ok','已连接'],error:['err','错误'],offline:['off','离线']};
    const [cls,txt]=map[state]||map.idle;
    if(pill){ pill.className='sync-pill '+cls; if(pillText) pillText.textContent=detail? txt+' · '+detail : txt; }
    if(nav){ nav.textContent = detail? (txt+' · '+detail) : txt; }
    if(panel){ panel.textContent = detail? (txt+'：'+detail) : txt; }
  }
};

const Sync={
  cfg:null, timers:{}, pending:[], restoring:false,
  // SCF 函数 URL 会把响应体以 isBase64Encoded 返回，浏览器 fetch 不会自动解码。
  // 这里做一个兼容：如果文本像 base64 且解码后是 JSON/XML，就返回解码结果。
  _tryScfDecode(raw){
    if(!raw || raw.length%4!==0 || raw.length<4) return raw;
    if(!/^[A-Za-z0-9+/]+={0,2}$/.test(raw)) return raw;
    try{
      const bin=atob(raw);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const decoded=new TextDecoder('utf-8').decode(bytes);
      if((decoded.charAt(0)==='{' && decoded.charAt(decoded.length-1)==='}') ||
         decoded.indexOf('<?xml')===0 || decoded.indexOf('<d:multistatus')===0 || decoded.indexOf('<D:multistatus')===0){
        return decoded;
      }
    }catch(e){}
    return raw;
  },
  _isSCFProxy(){ const c=this.cfg||this.loadCfg(); return !!(c && c.serverUrl && /tencentscf\.com|scf-proxy|functions\.yun\./i.test(c.serverUrl)); },
  loadCfg(){ try{ this.cfg=JSON.parse(localStorage.getItem('webdavConfig')||'null'); }catch(e){ this.cfg=null; } return this.cfg; },
  isConfigured(){ const c=this.cfg||this.loadCfg(); return !!(c && c.serverUrl && c.username && c.password); },
  authHeader(){ const c=this.cfg; return 'Basic '+btoa(unescape(encodeURIComponent(c.username+':'+c.password))); },
  folderPath(){ const c=this.cfg; return c.serverUrl.replace(/\/+$/,'')+'/dav/'+SYNC_FOLDER; },
  async request(method, path, body, isBinary){
    const c=this.cfg;
    const headers={'Authorization':this.authHeader()};
    if(c.secret) headers['X-Sync-Key']=c.secret;
    if(isBinary!==true) headers['Content-Type']='application/json';
    const init={method, headers};
    if(body!==undefined && !['GET','HEAD','OPTIONS'].includes(method)){
      init.body = (isBinary || typeof body==='string') ? body : JSON.stringify(body);
    }
    return fetch(path, init);
  },
  async testConnection(){
    SyncStatus.set('syncing','测试中');
    try{
      const res=await this.request('HEAD', this.folderPath());
      if(res.status===401){ SyncStatus.set('error','账号或应用密码错误'); return false; }
      if(res.status===404){ SyncStatus.set('error','目录不存在。手机/PWA 请填 SCF 代理网关 URL；桌面可填 https://dav.jianguoyun.com'); return false; }
      SyncStatus.set('success','上次 '+fmtTime(Date.now())); return true;
    }catch(e){ SyncStatus.set('error','无法连接（'+(e&&e.message||'')+'）'); return false; }
  },
  async uploadData(key, payload){
    const res=await this.request('PUT', this.folderPath()+'/'+key+'.json', payload);
    if(res.status===401) throw new Error('认证失败');
    if(res.status>=400) throw new Error('上传失败 HTTP '+res.status);
    return true;
  },
  async publishSite(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','发布中');
    try{
      const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      const path=this.folderPath()+'/personal-workbench.html';
      const res=await this.request('PUT', path, html, true);
      if(res.status===401) throw new Error('认证失败');
      if(res.status>=400) throw new Error('发布失败 HTTP '+res.status);
      SyncStatus.set('success','已发布 '+fmtTime(Date.now()));
      toast('已发布到云端，刷新 SCF 页面地址即最新版','ok');
    }catch(e){
      SyncStatus.set('error',(e&&e.message)||'发布失败');
      toast('发布失败：'+((e&&e.message)||''),'err');
    }
  },
  async downloadData(key){
    const res=await this.request('GET', this.folderPath()+'/'+key+'.json');
    if(res.status===404) return null;
    if(res.status>=400) throw new Error('下载失败 HTTP '+res.status);
    let txt=await res.text();
    txt=this._tryScfDecode(txt);
    try{ return JSON.parse(txt); }catch(e){ throw new Error('解析失败'); }
  },
  async fileExists(key){
    const res=await this.request('HEAD', this.folderPath()+'/'+key+'.json');
    return res.status===200 || res.status===207;
  },
  async listFiles(){
    try{
      const res=await this.request('PROPFIND', this.folderPath(), '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:resourcetype/><D:getetag/></D:prop></D:propfind>', true);
      if(res.status!==207) return [];
      let txt=await res.text();
      txt=this._tryScfDecode(txt);
      return [...txt.matchAll(/<[a-zA-Z]?:href>([^<]+)<\/[a-zA-Z]?:href>/g)].map(m=>decodeURIComponent(m[1])).filter(h=>/\.json$/.test(h));
    }catch(e){ return []; }
  },
  scheduleUpload(key){
    if(this.restoring || !this.isConfigured()) return;
    if(this.timers[key]) clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>this.pushKey(key), 3000);
  },
  async pushKey(key){
    if(!this.isConfigured()) return;
    const data=Store.get(key, null);
    if(data===null || data===undefined) return; // 本地无数据，不上传；删除走 pushDelete
    const meta=getSyncMeta(); const ts=Date.now(); meta[key]=ts; setSyncMeta(meta);
    try{
      SyncStatus.set('syncing');
      await this.uploadData(key, {updatedAt:ts, data});
      SyncStatus.set('success','上次 '+fmtTime(Date.now()));
    }catch(e){
      SyncStatus.set('error', (e&&e.message)||'错误');
      if(!navigator.onLine || /fetch|network|认证/i.test(e.message||'')) this.pending.push(key);
    }
  },
  async pushDelete(key){  // 删除同步：上传 {deleted:true} 标记，云端会据此清除
    if(!this.isConfigured()) return;
    const meta=getSyncMeta(); const ts=Date.now(); meta[key]=ts; setSyncMeta(meta);
    try{
      SyncStatus.set('syncing');
      await this.uploadData(key, {updatedAt:ts, deleted:true});
      SyncStatus.set('success','上次 '+fmtTime(Date.now()));
    }catch(e){
      SyncStatus.set('error', (e&&e.message)||'错误');
    }
  },
  async syncAll(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','全量上传');
    try{
      for(const key of getSyncKeys()){
        const data=Store.get(key, null);
        if(data===null || data===undefined) continue; // 本地无数据不上传
        const meta=getSyncMeta(); const ts=Date.now(); meta[key]=ts; setSyncMeta(meta);
        await this.uploadData(key, {updatedAt:ts, data});
      }
      SyncStatus.set('success','上次 '+fmtTime(Date.now())); toast('已同步到云端','ok');
    }catch(e){ SyncStatus.set('error', (e&&e.message)||'错误'); toast('同步失败：'+((e&&e.message)||''),'err'); }
  },
  async pullAll(){
    if(!this.isConfigured()) return;
    this.restoring=true; let changed=false;
    try{
      SyncStatus.set('syncing','拉取云端');
      for(const key of getSyncKeys()){
        let cloud; try{ cloud=await this.downloadData(key); }catch(e){ continue; }
        if(!cloud) continue;
        const meta=getSyncMeta(); const localTs=meta[key]||0;
        if(cloud.updatedAt>localTs){
          if(cloud.deleted){  // 云端标记已删除 → 清除本地
            const origDel=Store.del.bind(Store); const _orig=origDel; // 用原始 del 不触发上传
            try{ localStorage.removeItem(key); }catch(e){}
            const m=getSyncMeta(); m[key]=cloud.updatedAt; setSyncMeta(m);
            changed=true; continue;
          }
          if(cloud.data===null || cloud.data===undefined){
            // 云端无有效数据，不覆盖本地；若本地有数据则反向修复云端
            const localData=Store.get(key, null);
            if(localData!==null && localData!==undefined){
              const ts=Date.now();
              await this.uploadData(key, {updatedAt:ts, data:localData});
              const m=getSyncMeta(); m[key]=ts; setSyncMeta(m);
              changed=true;
            }
            continue;
          }
          Store.set(key, cloud.data);
          const m=getSyncMeta(); m[key]=cloud.updatedAt; setSyncMeta(m);
          changed=true;
        }
      }
      SyncStatus.set('success','上次 '+fmtTime(Date.now()));
    }catch(e){ SyncStatus.set('error', (e&&e.message)||'错误'); }
    finally{ this.restoring=false; }
    if(changed){ refreshDashboard(); render(); toast('已从云端合并更新','ok'); }
  },
  async fullSync(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','双向同步');
    await this.pullAll();
    await this.syncAll();
  }
};

// 挂钩 Store.set / Store.del：所有模块数据变更后自动防抖上传到坚果云
(function hookStore(){
  const _set=Store.set.bind(Store), _del=Store.del.bind(Store);
  Store.set=function(k,v){ _set(k,v); if(!SYNC_BLACKLIST.has(k)){ registerSyncKey(k); Sync.scheduleUpload(k); } };
  Store.del=function(k){ _del(k); if(!SYNC_BLACKLIST.has(k)) Sync.pushDelete(k); };
})();

function initSync(){
  Sync.loadCfg();
  const box=$('#syncBox'), head=$('#syncHead');
  if(head) head.onclick=()=>box.classList.toggle('collapsed');
  if($('#cfgShow')) $('#cfgShow').onclick=()=>{ const p=$('#cfgPass'); p.type = p.type==='password'?'text':'password'; };
  if($('#cfgSave')) $('#cfgSave').onclick=()=>{
    const cfg={ serverUrl:$('#cfgUrl').value.trim(), username:$('#cfgUser').value.trim(), password:$('#cfgPass').value, secret:$('#cfgSecret').value.trim() };
    if(!cfg.serverUrl||!cfg.username||!cfg.password){ toast('请填写完整的服务器地址、账号、应用密码','err'); return; }
    localStorage.setItem('webdavConfig', JSON.stringify(cfg));
    Sync.cfg=cfg; toast('配置已保存','ok'); Sync.testConnection(); Sync.fullSync();
  };
  if($('#cfgTest')) $('#cfgTest').onclick=()=>Sync.testConnection();
  if($('#cfgPublish')) $('#cfgPublish').onclick=()=>Sync.publishSite();
  if($('#cfgSync')) $('#cfgSync').onclick=()=>Sync.fullSync();
  if($('#syncBtn')) $('#syncBtn').onclick=()=>Sync.fullSync();
  if($('#exportBtn')) $('#exportBtn').onclick=()=>exportAllData();
  if($('#importBtn')) $('#importBtn').onclick=()=>importAllData();
  if(Sync.cfg){ $('#cfgUrl').value=Sync.cfg.serverUrl||''; $('#cfgUser').value=Sync.cfg.username||''; $('#cfgPass').value=Sync.cfg.password||''; $('#cfgSecret').value=Sync.cfg.secret||''; }
  window.addEventListener('online', ()=>{ if(Sync.pending.length){ Sync.pending=[]; Sync.fullSync(); } else SyncStatus.set('success','已恢复'); });
  window.addEventListener('offline', ()=>SyncStatus.set('offline','离线'));
  if(!navigator.onLine) SyncStatus.set('offline','离线');
  if(Sync.isConfigured()){ Sync.testConnection(); Sync.fullSync(); }
  else SyncStatus.set('offline','未配置');
}

/* ============================ 界面主题（风格切换） ============================ */
const THEME_KEY='uiTheme';
function applyTheme(name){
  name=name||'teal';
  document.documentElement.className = (name==='teal') ? '' : ('theme-'+name);
  try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
}
function initTheme(){
  let t='teal'; try{ t=localStorage.getItem(THEME_KEY)||'teal'; }catch(e){}
  applyTheme(t);
  const sel=$('#themeSel'); if(sel){ sel.value=t; sel.onchange=()=>applyTheme(sel.value); }
}
/* 数据迁移：旧「今日聚焦」并入「今日待办」，丢弃聚焦概念 */
function migrateFocusToTodo(){
  try{
    const tasks=Store.get('tasks', null);
    if(Array.isArray(tasks) && tasks.length){
      const todos=Store.get('todayTodos', [])||[];
      const ids=new Set(todos.map(t=>t.id));
      tasks.forEach(t=>{ if(t && t.id && !ids.has(t.id)) todos.push(t); });
      Store.set('todayTodos', todos);
      Store.del('tasks');
    }
  }catch(e){}
}

/* ============================ 初始化 ============================ */
function tickClock(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); $('#clock').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function init(){
  migrateFocusToTodo();
  initTheme();
  buildNav();
  initSync();
  $('#hamburger').onclick=()=>{ const sb=$('#sidebar'); sb.classList.toggle('open'); let bd=$('.backdrop'); if(sb.classList.contains('open')&&!bd){ bd=document.createElement('div'); bd.className='backdrop'; bd.onclick=()=>{ sb.classList.remove('open'); bd.remove(); }; document.body.appendChild(bd); } else if(!sb.classList.contains('open')&&bd){ bd.remove(); } };
  $('#logoutBtn').onclick=()=>logoutMenu();
  function logoutMenu(){
    const body=document.createElement('div');
    body.innerHTML='<div class="warn" style="margin-bottom:10px">选择退出方式：</div>'+
      '<div style="font-size:13px;line-height:1.8;color:var(--ink-2)">'+
      '🔒 <b>锁屏</b>：保留本机所有数据，下次打开需重新输入主密码。<br>'+
      '🧹 <b>清除本机全部数据</b>：删除本浏览器所有本地数据（加密业务数据 + 同步配置）。'+
      '云端已同步的数据可在重设同步后恢复；<b>未同步的改动会丢失</b>。</div>';
    openModal({ title:'退出工作台', body, actions:[
      {label:'取消', onClick:c=>c()},
      {label:'锁屏', primary:true, onClick:c=>{ MasterKey.clear(); c(); location.reload(); }},
      {label:'清除记住的主密码', onClick:c=>{ MasterKey.forget(); c(); toast('已清除本机记住的主密码，下次需重新输入','ok'); }},
      {label:'清除本机数据', danger:true, onClick:c=>{
        c();
        confirmModal('将删除本浏览器所有本地数据且不可撤销。仅当已同步到云端时数据可恢复。确定继续？', {title:'确认清除本机数据', ok:'确认清除'}).then(ok=>{
          if(ok){ try{ localStorage.clear(); sessionStorage.clear(); }catch(e){} location.reload(); }
        });
      }}
    ]});
  }
  tickClock(); setInterval(tickClock, 30000);
  // 移动端底部 Tab 栏
  $$('#tabbar .tab').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id;
      if(id==='__more'){
        const sb=$('#sidebar'); sb.classList.add('open');
        let bd=$('.backdrop'); if(!bd){ bd=document.createElement('div'); bd.className='backdrop'; bd.onclick=()=>{ sb.classList.remove('open'); bd.remove(); }; document.body.appendChild(bd); }
      } else go(id);
    };
  });
  if(!MasterKey.get() && MasterKey.tryTrusted()){ /* 受信任设备已记住，直接进，无需弹主密码 */ }
  // 拦截系统返回键：PWA/手机端避免一按返回就直接退出，改为先回首页、再按一次才退出
  let _exitArmed=false;
  if('pushState' in history){
    try{ history.pushState({view:'home'}, ''); }catch(e){}  // 守卫占位：保证首页按返回会触发 popstate 而非直接退出
    window.addEventListener('popstate', function(e){
      const sb=$('#sidebar');
      if(sb && sb.classList.contains('open')){ sb.classList.remove('open'); const bd=$('.backdrop'); if(bd) bd.remove(); return; } // 抽屉打开时返回先关抽屉
      const v=(e.state && e.state.view) ? e.state.view : 'home';
      go(v, false); // 跟随浏览器历史回退，不再重复压栈
      if(v==='home'){
        if(_exitArmed){ /* 已二次确认，允许真正退出（不再占位） */ }
        else { _exitArmed=true; try{ history.pushState({view:'home'}, ''); }catch(_){} toast('再按一次返回退出应用'); setTimeout(function(){ _exitArmed=false; }, 2000); }
      } else { _exitArmed=false; }
    });
  }
  checkArchiveDue();  // 打开应用时检查「完成满2天」的月度项并自动归档
  checkBackupReminder();  // 数据积累到30条时顶部温和提示导出备份
  go('home');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
:root,
.theme-teal{
  /* 默认风格 D：柔和蓝绿圆角 */
  --bg:#eef6f5; --panel:#ffffff; --panel-2:#f3f8f8; --ink:#143a38; --ink-2:#5d7876;
  --line:#d9e9e7; --line-2:#c2d8d5; --brand:#0d9488; --brand-d:#0b7d72; --brand-soft:#cdeae7;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --radius:16px; --shadow:0 1px 3px rgba(13,148,136,.06),0 6px 20px rgba(13,148,136,.07);
  --shadow-lg:0 14px 44px rgba(15,40,38,.18); --sidebar-w:240px;
  --topbar-bg:rgba(255,255,255,.92); --input-bg:#f4faf9;
}
/* 米灰（原风格） */
.theme-mist{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f8fafc; --ink:#1f2937; --ink-2:#6b7280;
  --line:#e5e7eb; --line-2:#d1d5db; --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#dbeafe;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.18); --sidebar-w:240px;
  --topbar-bg:rgba(255,255,255,.92); --input-bg:#f8fafc;
}
/* 暗色护眼 */
.theme-dark{
  --bg:#0f172a; --panel:#1e293b; --panel-2:#243049; --ink:#e6edf3; --ink-2:#94a3b8;
  --line:#334155; --line-2:#475569; --brand:#2dd4bf; --brand-d:#14b8a6; --brand-soft:#134e4a;
  --green:#4ade80; --green-soft:#14321f; --amber:#fbbf24; --amber-soft:#3a2f12;
  --red:#f87171; --red-soft:#3a1d1d; --purple:#c084fc; --purple-soft:#2e1a47;
  --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.55); --sidebar-w:240px;
  --topbar-bg:rgba(15,23,42,.9); --input-bg:#0f172a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
a{color:var(--brand); text-decoration:none}

/* layout */
.app{display:flex; min-height:100vh}
.sidebar{width:var(--sidebar-w); background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40; overflow-y:auto;}
.sidebar .brand{padding:18px 18px 12px; font-weight:700; font-size:17px; color:var(--brand);
  display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line);}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.nav{padding:10px 8px; flex:1}
.nav-group-title{padding:10px 12px 4px; font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.5px}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:var(--ink);
  cursor:pointer; margin:2px 0; user-select:none; transition:.15s; font-size:14px}
.nav-item:hover{background:var(--panel-2)}
.nav-item.active{background:var(--brand-soft); color:var(--brand-d); font-weight:600}
.nav-item .ico{width:20px; text-align:center}
.nav-item .caret{margin-left:auto; transition:.2s}
.nav-item.collapsed .caret{transform:rotate(-90deg)}
.nav-children{margin-left:14px; border-left:1px dashed var(--line-2); padding-left:4px}
.nav-children .nav-item{font-size:13px; padding:7px 10px}
.sidebar .foot{padding:10px 14px; font-size:11px; color:var(--ink-2); border-top:1px solid var(--line)}

.main{margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{position:sticky; top:0; z-index:30; background:var(--topbar-bg);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 18px;
  display:flex; align-items:center; gap:14px}
.hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:16px}
.topbar h1{font-size:16px; margin:0; font-weight:700}
.topbar .spacer{flex:1}
.topbar .meta{font-size:12px; color:var(--ink-2)}

/* dashboard bar */
.dashbar{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 18px 4px}
.metric{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.metric .label{font-size:12px; color:var(--ink-2)}
.metric .value{font-size:26px; font-weight:800; margin-top:4px}
.metric .sub{font-size:11px; color:var(--ink-2)}
.metric.c1 .value{color:var(--brand)} .metric.c2 .value{color:var(--green)}
.metric.c3 .value{color:var(--purple)} .metric.c4 .value{color:var(--amber)}

.view{padding:14px 18px 60px; flex:1}
.view-head{display:flex; align-items:center; gap:12px; margin:6px 0 16px; flex-wrap:wrap}
.view-head h2{margin:0; font-size:20px}
.view-head .spacer{flex:1}
.btn{background:var(--panel); border:1px solid var(--line-2); color:var(--ink); padding:8px 14px;
  border-radius:9px; font-size:13px; transition:.15s; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--brand); color:var(--brand)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-d); color:#fff}
.btn.danger{background:#fff; border-color:var(--red); color:var(--red)}
.btn.danger:hover{background:var(--red); color:#fff}
.btn.sm{padding:5px 10px; font-size:12px}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{color:var(--brand); border-color:transparent}

/* cards / lists */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.grid{display:grid; gap:14px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.list{display:flex; flex-direction:column; gap:10px}
.item{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  display:flex; align-items:flex-start; gap:12px; transition:.15s}
.item:hover{border-color:var(--line-2)}
.item .chk{width:20px;height:20px;margin-top:2px;flex:none;cursor:pointer}
.item .body{flex:1; min-width:0}
.item .title{font-weight:600; word-break:break-word}
.item .title.done{text-decoration:line-through; color:var(--ink-2)}
.item .meta{font-size:12px; color:var(--ink-2); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.tag{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600}
.tag.p-high{background:var(--red-soft); color:var(--red)}
.tag.p-mid{background:var(--amber-soft); color:var(--amber)}
.tag.p-low{background:var(--green-soft); color:var(--green)}
.tag.cat{background:var(--brand-soft); color:var(--brand-d)}
.tag.stat-todo{background:var(--amber-soft); color:var(--amber)}
.tag.stat-doing{background:var(--brand-soft); color:var(--brand-d)}
.tag.stat-done{background:var(--green-soft); color:var(--green)}
.tag.sev-high{background:var(--red-soft); color:var(--red)}
.tag.sev-mid{background:var(--amber-soft); color:var(--amber)}
.tag.sev-low{background:var(--green-soft); color:var(--green)}
.item .ops{display:flex; gap:6px; flex:none}
.empty{padding:40px; text-align:center; color:var(--ink-2); border:1px dashed var(--line-2); border-radius:12px}

/* tabs */
.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:14px}
.tab{padding:9px 14px; border:none; background:none; color:var(--ink-2); font-size:14px; border-bottom:2px solid transparent}
.tab.active{color:var(--brand); border-bottom-color:var(--brand); font-weight:600}

/* table */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--panel-2); font-weight:600; color:var(--ink-2); position:sticky; top:0}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel-2)}
td .ops{display:flex; gap:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* progress */
.progress{height:8px; background:var(--line); border-radius:999px; overflow:hidden; min-width:120px}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--green)); border-radius:999px}
.progress-num{font-size:12px; color:var(--ink-2); min-width:38px; text-align:right}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100; display:flex; align-items:center;
  justify-content:center; padding:18px; animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel); border-radius:14px; box-shadow:var(--shadow-lg); width:min(560px,100%);
  max-height:90vh; display:flex; flex-direction:column; overflow:hidden}
.modal.wide{width:min(820px,100%)}
.modal.full{width:min(960px,100%)}
.modal .m-head{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:700; font-size:16px;
  display:flex; align-items:center; gap:8px}
.modal .m-head .x{margin-left:auto; cursor:pointer; color:var(--ink-2); font-size:18px; border:none; background:none}
.modal .m-body{padding:18px; overflow-y:auto}
.modal .m-foot{padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; background:var(--panel-2)}
.field{margin-bottom:13px}
.field label{display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px; font-weight:600}
.field input,.field select,.field textarea{width:100%; padding:9px 11px; border:1px solid var(--line-2);
  border-radius:9px; background:var(--input-bg); color:var(--ink)}
.field textarea{resize:vertical; min-height:80px}
.field .hint{font-size:11px; color:var(--ink-2); margin-top:4px}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pw-wrap{display:flex; gap:8px; align-items:center}
.pw-wrap input{flex:1}
.strength{height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:6px}
.strength > i{display:block; height:100%}

/* toast */
.toast-wrap{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; flex-direction:column; gap:10px}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px;
  box-shadow:var(--shadow-lg); animation:slidein .2s ease; max-width:340px}
.toast.ok{background:#166534} .toast.err{background:#991b1b} .toast.info{background:#1e3a8a}
@keyframes slidein{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* calendar */
.cal-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.cal-head .mm{font-size:18px; font-weight:700; min-width:130px; text-align:center}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cal .dow{text-align:center; font-size:12px; color:var(--ink-2); padding:4px 0; font-weight:600}
.cal .day{background:var(--panel); border:1px solid var(--line); border-radius:10px; min-height:96px; padding:8px;
  cursor:pointer; transition:.15s; position:relative; display:flex; flex-direction:column; gap:4px}
.cal .day:hover{border-color:var(--brand)}
.cal .day.other{opacity:.45}
.cal .day.today{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
.cal .day.sel{background:var(--brand-soft)}
.cal .day .dnum{font-weight:700; font-size:13px}
.cal .day .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);display:inline-block}
.cal .day .dots{display:flex; gap:3px; flex-wrap:wrap; margin-top:auto}
.cal .day .mini{font-size:11px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cal .day .pct{font-size:10px; color:var(--green); font-weight:700}

/* detail panel */
.detail .ditem{border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:10px}
.detail .ditem .top{display:flex; gap:10px; align-items:flex-start}
.detail .ditem .ttl{font-weight:600; flex:1}
.detail .ditem .ttl.done{text-decoration:line-through; color:var(--ink-2)}
.subtasks{margin-top:8px; padding-left:4px; display:flex; flex-direction:column; gap:5px}
.subtask{display:flex; gap:8px; align-items:center; font-size:13px}
.subtask.done span{text-decoration:line-through; color:var(--ink-2)}
.stat-box{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0}
.stat-pill{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px}
.stat-pill b{display:block; font-size:18px}

/* knowledge */
.kb-card{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--panel)}
.kb-card h4{margin:0 0 4px; font-size:15px}
.kb-card .content{color:var(--ink-2); font-size:13px; max-height:60px; overflow:hidden; white-space:pre-wrap}
.search{width:100%; max-width:320px; padding:8px 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--input-bg); color:var(--ink)}

/* 账号多组 / 主题切换 / 密码强度 */
.acc-row{display:flex; gap:6px; align-items:center; margin-bottom:6px}
.acc-row input{flex:1}
.cat-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.cat-chips .chip{cursor:pointer; transition:.15s}
.cat-chips .chip:hover{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-d)}
.acc-line{padding:6px 0; border-top:1px dashed var(--line); margin-top:6px}
.acc-line:first-of-type{border-top:none; margin-top:2px}
.theme-sel{padding:6px 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--panel); color:var(--ink); font-size:12px; cursor:pointer}
.pw-strength{margin-top:6px; display:flex; align-items:center; gap:8px}
.pw-strength .bar{flex:1; height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.pw-strength .bar > i{display:block; height:100%; background:var(--line-2); transition:.2s}
.pw-strength.weak .bar > i{background:var(--red); width:33%}
.pw-strength.mid .bar > i{background:var(--amber); width:66%}
.pw-strength.strong .bar > i{background:var(--green); width:100%}
.pw-strength .txt{font-size:12px; color:var(--ink-2); min-width:28px}
.theme-dark .toast{background:#334155; color:#fff}

/* misc */
.hide{display:none!important}
.muted{color:var(--ink-2)}
.center{text-align:center}
.md-pre{white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; max-height:60vh; overflow:auto}
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; background:var(--panel-2);
  border:1px solid var(--line); font-size:12px; cursor:pointer}
.chip.active{background:var(--brand); color:#fff; border-color:var(--brand)}
.warn{background:var(--amber-soft); color:var(--amber); border:1px solid #fde68a; padding:8px 12px; border-radius:9px; font-size:12px}

/* ============ 同步 / WebDAV ============ */
.sync-box{border-top:1px solid var(--line); padding:6px 10px 10px}
.sync-head{display:flex; align-items:center; gap:8px; cursor:pointer; padding:7px 4px; font-size:13px; color:var(--ink-2); font-weight:600; user-select:none}
.sync-head .caret{margin-left:auto; transition:.2s}
.sync-box.collapsed .caret{transform:rotate(-90deg)}
.sync-box.collapsed .sync-body{display:none}
.sync-body{padding:4px 2px 0}
.sync-body .field{margin-bottom:9px}
.sync-body .field input{padding:7px 10px}
.sync-status{font-size:11px; color:var(--ink-2); margin-top:8px; padding:6px 9px; border-radius:8px; background:var(--panel-2); line-height:1.5}
.sync-pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line-2); background:var(--panel); white-space:nowrap}
.sync-pill .dot{width:8px; height:8px; border-radius:50%; background:var(--ink-2)}
.sync-pill.off{color:var(--ink-2)} .sync-pill.off .dot{background:var(--ink-2)}
.sync-pill.ok{background:var(--green-soft); color:var(--green); border-color:#bbf7d0} .sync-pill.ok .dot{background:var(--green)}
.sync-pill.syncing{background:var(--amber-soft); color:var(--amber); border-color:#fde68a} .sync-pill.syncing .dot{background:var(--amber)}
.sync-pill.err{background:var(--red-soft); color:var(--red); border-color:#fecaca} .sync-pill.err .dot{background:var(--red)}

/* responsive */
@media(max-width:1100px){ .dashbar{grid-template-columns:repeat(2,1fr)} .cols-3{grid-template-columns:repeat(2,1fr)} }
@media(max-width:860px){
  .sidebar{transform:translateX(-100%); transition:.2s; box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:inline-flex}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:39}
  .cols-2,.cols-3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .dashbar{grid-template-columns:1fr 1fr; gap:10px}
  .field-row{grid-template-columns:1fr}
  .view{padding:12px 12px 60px}
  .cal .day{min-height:70px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">🔧</span> 个人工作台</div>
    <nav class="nav" id="nav"></nav>
    <div class="sync-box collapsed" id="syncBox">
      <div class="sync-head" id="syncHead"><span>☁️ 坚果云同步设置</span><span class="caret">▾</span></div>
      <div class="sync-body" id="syncBody">
        <div class="field"><label>服务器地址（代理网关 URL）</label><input id="cfgUrl" placeholder="https://xxx.apigw.tencentcs.com/release/wbproxy"></div>
        <div class="field"><label>坚果云账号（邮箱）</label><input id="cfgUser" placeholder="your-email@example.com"></div>
        <div class="field"><label>应用密码（第三方应用专用）</label>
          <div style="position:relative"><input id="cfgPass" type="password" placeholder="坚果云 WebDAV 应用密码">
          <button class="btn sm ghost" id="cfgShow" type="button" style="position:absolute;right:4px;top:3px;padding:3px 8px">👁️</button></div>
        </div>
        <div class="field"><label>共享密钥（可选，需与代理端一致）</label><input id="cfgSecret" placeholder="留空则不校验"></div>
        <div class="row" style="margin:2px 0 4px">
          <button class="btn primary sm" id="cfgSave">💾 保存配置</button>
          <button class="btn sm" id="cfgTest">🔗 测试</button>
          <button class="btn sm" id="cfgSync">🔄 立即同步</button>
        </div>
        <div class="row" style="margin:2px 0 4px">
          <button class="btn sm" id="cfgPublish" title="把当前页面壳发布到坚果云，SCF 的 /app/ 路由会直接托管，刷新页面地址即最新版">📤 发布到云端（SCF 托管）</button>
        </div>
        <div class="sync-status" id="syncStatus">未配置</div>
      </div>
    </div>
    <div class="foot">数据本地存储 · localStorage<br>加密：AES-256</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <h1 id="viewTitle">个人工作台</h1>
      <div class="spacer"></div>
      <button class="btn sm" id="syncBtn" title="立即双向同步">🔄 同步</button>
      <span class="sync-pill off" id="syncPill"><span class="dot"></span><span id="syncPillText">未配置</span></span>
      <select id="themeSel" class="theme-sel" title="切换界面风格">
        <option value="teal">🟢 柔和蓝绿</option>
        <option value="mist">⚪ 米灰</option>
        <option value="dark">🌙 暗色</option>
      </select>

/* ============================ 加密层（CDN + 离线降级） ============================ */
const MasterKey={
  get(){ return sessionStorage.getItem('masterKey'); },
  set(k){ sessionStorage.setItem('masterKey', k); },
  clear(){ sessionStorage.removeItem('masterKey'); },
  valid(p){ return p && p.length>=6; },
  ensure(force){
    return new Promise((resolve,reject)=>{
      const existing=this.get();
      if(existing && !force){ return resolve(existing); }
      let val='';
      const body=document.createElement('div');
      body.innerHTML=
        '<div class="field"><label>主密码（用于加密账号/网址，至少 8 位，含大小写+数字+符号更安全）</label>'+
        '<input type="password" id="mk" placeholder="请输入主密码">'+
        '<div class="pw-strength" id="mkStrength"><span class="bar"><i></i></span><span class="txt"></span></div></div>'+
        '<div class="field"><label>确认主密码</label><input type="password" id="mk2" placeholder="再次输入"></div>'+
        '<div class="warn">主密码仅保存在本次会话（sessionStorage），关闭页面后需重新输入；<b>系统不存储明文且无法找回，请牢记。</b></div>';
      const m=openModal({
        title:'设置主密码',
        body, size:'',
        actions:[
          {label:'取消', onClick:c=>{ c(); reject(new Error('cancelled')); }},
          {label:'确定', primary:true, onClick:c=>{
            const a=$('#mk').value, b=$('#mk2').value;
            if(!MasterKey.valid(a)){ toast('主密码至少 6 位','err'); return; }
            if(a!==b){ toast('两次输入不一致','err'); return; }
            MasterKey.set(a); c(); resolve(a);
          }}
        ]
      });
      const _mk=body.querySelector('#mk'), _st=body.querySelector('#mkStrength');
      if(_mk&&_st){ const _upd=()=>{ const r=evaluatePwd(_mk.value); _st.className='pw-strength '+(r.cls||''); _st.querySelector('.txt').textContent=r.label; }; _mk.addEventListener('input',_upd); _upd(); }
    });
  },
  prompt(){
    return new Promise((resolve,reject)=>{
      const body=document.createElement('div');
      body.innerHTML='<div class="field"><label>主密码</label><input type="password" id="mk" placeholder="请输入主密码解锁">'+
        '<div class="pw-strength" id="mkStrength"><span class="bar"><i></i></span><span class="txt"></span></div></div>';
      openModal({ title:'解锁加密数据', body, actions:[
        {label:'取消', onClick:c=>{ c(); reject(new Error('cancelled')); }},
        {label:'解锁', primary:true, onClick:c=>{ const v=$('#mk').value; if(!v){toast('请输入密码','err');return;} c(); resolve(v); }}
      ]});
      const _mk=body.querySelector('#mk'), _st=body.querySelector('#mkStrength');
      if(_mk&&_st){ const _upd=()=>{ const r=evaluatePwd(_mk.value); _st.className='pw-strength '+(r.cls||''); _st.querySelector('.txt').textContent=r.label; }; _mk.addEventListener('input',_upd); _upd(); }
    });
  }
};
/* 主密码强度评估：返回 {cls:'weak'|'mid'|'strong', label} */
function evaluatePwd(pw){
  if(!pw) return {cls:'', label:''};
  let s=0;
  if(pw.length>=8) s++;
  if(pw.length>=12) s++;
  if(/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if(/\d/.test(pw)) s++;
  if(/[^A-Za-z0-9]/.test(pw)) s++;
  let label, cls;
  if(pw.length<6){ label='太短'; cls='weak'; }
  else if(s<=2){ label='弱'; cls='weak'; }
  else if(s===3){ label='中'; cls='mid'; }
  else if(s===4){ label='强'; cls='strong'; }
  else { label='极强'; cls='strong'; }
  return {cls, label};
}
const Sec={
  async encrypt(plain){
    const key=MasterKey.get();
    if(!key) throw new Error('no master key');
    if(window.CryptoJS) return CryptoJS.AES.encrypt(plain, key).toString();
    return await wcEncrypt(plain, key);
  },
  async decrypt(cipher){
    const key=MasterKey.get();
    if(!key) throw new Error('no master key');
    if(typeof cipher==='string' && cipher.startsWith('WC1:')) return await wcDecrypt(cipher.slice(4), key);
    if(window.CryptoJS) return CryptoJS.AES.decrypt(cipher, key).toString(CryptoJS.enc.Utf8);
    throw new Error('CRYPTO_MISSING');
  }
};
/* 离线降级：WebCrypto AES-GCM-256 + PBKDF2，前缀 WC1: */
function b64u(bytes){ let s=''; const arr=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes); for(let i=0;i<arr.length;i++) s+=String.fromCharCode(arr[i]); return btoa(s); }
function unb64u(b){ const s=atob(b); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function wcEncrypt(plain, pass){
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plain));
  const out=new Uint8Array(16+12+ct.byteLength); out.set(salt,0); out.set(iv,16); out.set(new Uint8Array(ct),28);
  return 'WC1:'+b64u(out);
}
async function wcDecrypt(payload, pass){
  const all=unb64u(payload);
  const salt=all.slice(0,16), iv=all.slice(16,28), ct=all.slice(28);
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

/* ============================ 加密集合读写 ============================ */
async function loadEncrypted(key){
  const raw=Store.get(key);
  if(!raw) return [];
  try{ return JSON.parse(await Sec.decrypt(raw)); }
  catch(e){ if(e.message==='CRYPTO_MISSING'){ toast('加密库未加载，请联网后重试','err'); } else { toast('解密失败：主密码可能错误','err'); } return null; }
}
async function saveEncrypted(key, arr){
  const cipher=await Sec.encrypt(JSON.stringify(arr));
  Store.set(key, cipher);
}

function copyTodoToMonth(it){

function syncLinkDone(src){
  // src 是待办，找到月度中 linkId 对应的项，同步 done
  const plan=Store.get(KEY.month,{})||{};
  Object.keys(plan).forEach(d=>{
    plan[d]=plan[d].map(x=>{ if(x.linkId===src.id){ const nx={...x, done:src.done, progress:src.done?100:x.progress}; return nx; } return x; });
  });
  Store.set(KEY.month, plan);
}



/* ============== 月度计划（核心） ============== */
function renderMonth(){
  const view=$('#view'); const y=state.viewYear, m=state.viewMonth;
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; // 周一为起点
  const days=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate();
  let html='<div class="view-head"><h2>📅 月度计划</h2><div class="spacer"></div>'+
    btn('📝 生成月度总结','',genMonthSummary)+btn('+ 今日添加','primary',()=>monthItemEdit(null, todayKey()))+'</div>';
  html+='<div class="cal-head"><button class="btn sm" id="prevM">‹ 上月</button><span class="mm">'+y+'年'+(m+1)+'月</span><button class="btn sm" id="nextM">下月 ›</button></div>';
  html+='<div class="cal">';
  ['一','二','三','四','五','六','日'].forEach(d=>html+='<div class="dow">'+d+'</div>');
  // 上月补齐
  for(let i=startDow-1;i>=0;i--){ html+='<div class="day other"><div class="dnum">'+(prevDays-i)+'</div></div>'; }
  const plan=Store.get(KEY.month,{})||{};
  const tKey=todayKey();
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const arr=plan[ds]||[]; const done=arr.filter(isComplete).length;
    const rate=arr.length?Math.round(done/arr.length*100):0;
    const dots=arr.slice(0,3).map(it=>'<span class="dot" title="'+escapeHtml(it.text)+'"></span>').join('');
    const mini=arr[0]?('<div class="mini">'+escapeHtml(arr[0].text)+'</div>'):'';
    const cls='day'+(ds===tKey?' today':'')+(state.selDate===ds?' sel':'');
    html+='<div class="'+cls+'" data-date="'+ds+'"><div class="dnum">'+d+'</div>'+mini+
      '<div class="dots">'+dots+(arr.length>3?'<span class="muted" style="font-size:10px">+'+(arr.length-3)+'</span>':'')+'</div>'+
      (arr.length?'<div class="pct">'+rate+'%</div>':'')+'</div>';
  }
  // 下月补齐
  const total=startDow+days; const tail=(7-total%7)%7;
  for(let d=1;d<=tail;d++){ html+='<div class="day other"><div class="dnum">'+d+'</div></div>'; }
  html+='</div>';
  html+='<div id="dayPanel" style="margin-top:16px"></div>';
  view.innerHTML=html;
  $('#prevM').onclick=()=>{ if(m===0){state.viewMonth=11;state.viewYear--;}else state.viewMonth--; refreshDashboard(); renderMonth(); };
  $('#nextM').onclick=()=>{ if(m===11){state.viewMonth=0;state.viewYear++;}else state.viewMonth++; refreshDashboard(); renderMonth(); };
  $$('.cal .day[data-date]').forEach(el=>{ el.onclick=()=>{ state.selDate=el.dataset.date; renderMonth(); }; });
  if(!state.selDate) state.selDate=todayKey();
  renderDayPanel(state.selDate);
}
function renderDayPanel(ds){
  const panel=$('#dayPanel'); if(!panel) return;
  const plan=Store.get(KEY.month,{})||{}; const arr=plan[ds]||[];
  let html='<div class="card detail"><div class="view-head" style="margin:0 0 12px"><h3 style="margin:0">📆 '+ds+' 当日计划</h3><div class="spacer"></div>'+btn('+ 添加任务','primary',()=>monthItemEdit(null, ds))+'</div>';
  if(!arr.length){ html+='<div class="empty">这一天还没有计划任务</div></div>'; panel.innerHTML=html; return; }
  arr.forEach(it=>{
    const subs=(it.subtasks||[]).map((s,i)=>'<label class="subtask '+(s.done?'done':'')+'"><input type="checkbox" data-i="'+i+'" '+(s.done?'checked':'')+'> <span>'+escapeHtml(s.text)+'</span></label>').join('');
    html+='<div class="ditem" data-id="'+it.id+'">'+
      '<div class="top"><input type="checkbox" class="chk" '+(it.done?'checked':'')+'>'+
        '<div class="ttl '+(it.done?'done':'')+'">'+escapeHtml(it.text)+'</div>'+
        priTag(it.priority||'mid')+(it.category?'<span class="tag cat">'+escapeHtml(it.category)+'</span>':'')+'</div>'+
      '<div class="meta row" style="margin-top:6px"><div class="progress"><i style="width:'+(it.progress||0)+'%"></i></div><span class="progress-num">'+(it.progress||0)+'%</span>'+
        opBtn('编辑','sm',()=>monthItemEdit(it, ds))+opBtn('复制待办','sm',()=>copyMonthToTodo(it))+opBtn('删','sm danger',()=>delMonth(it, ds))+'</div>'+
      (subs?'<div class="subtasks">'+subs+'</div>':'')+
    '</div>';
  });
  html+='</div>'; panel.innerHTML=html;
  // 绑定
  $$('.ditem', panel).forEach(box=>{
    const id=box.dataset.id; const it=arr.find(x=>x.id===id); if(!it) return;
    box.querySelector('.chk').onchange=e=>{ it.done=e.target.checked; if(it.done) it.progress=100; it.updatedAt=nowISO(); saveMonthItem(ds,it); };
    $$('.subtask input', box).forEach(cb=>{ cb.onchange=e=>{ const i=+cb.dataset.i; it.subtasks[i].done=e.target.checked; it.updatedAt=nowISO(); saveMonthItem(ds,it); }; });
  });
}
function saveMonthItem(ds, it){
  const plan=Store.get(KEY.month,{})||{}; const arr=plan[ds]||[];
  const idx=arr.findIndex(x=>x.id===it.id);
  if(idx>=0) arr[idx]=it; else arr.push(it);
  plan[ds]=arr; Store.set(KEY.month, plan);
  // 自动归档
  if(isComplete(it)){ archiveMonthItem(ds, it); }
  refreshDashboard(); renderMonth();
}
function archiveMonthItem(ds, it){
  const arr=Store.get(KEY.year,[])||[];
  if(arr.find(a=>a.id===it.id)) return;
  arr.unshift({id:it.id, title:it.text, category:it.category||'未分类', sourceDate:ds, completedAt:nowISO(), subtasks:it.subtasks||[], archivedAt:nowISO()});
  Store.set(KEY.year, arr);
  // 从月度计划移除
  const plan=Store.get(KEY.month,{})||{}; if(plan[ds]){ plan[ds]=plan[ds].filter(x=>x.id!==it.id); if(!plan[ds].length) delete plan[ds]; Store.set(KEY.month, plan); }
  toast('已完成任务已归档到年度回顾','ok');
}
function copyMonthToTodo(it){
  const todos=Store.get(KEY.todo,[]);
  if(todos.find(t=>t.linkId===it.id)){ toast('已存在关联待办','info'); return; }
  todos.unshift({id:uid(), text:it.text, done:it.done, priority:it.priority||'mid', createdAt:nowISO(), linkId:it.id});
  Store.set(KEY.todo, todos); toast('已复制到今日待办','ok'); refreshDashboard();
}
async function delMonth(it, ds){
  if(await confirmModal('确定删除该月度任务「'+it.text+'」？')){
    const plan=Store.get(KEY.month,{})||{}; if(plan[ds]){ plan[ds]=plan[ds].filter(x=>x.id!==it.id); if(!plan[ds].length) delete plan[ds]; Store.set(KEY.month, plan); }
    refreshDashboard(); renderMonth(); toast('已删除','ok');
  }
}
function monthItemEdit(it, ds){

  openModal({ title:isNew?'新建月度任务':'编辑月度任务', body, size:'', actions:[

      const oldSubs=data.subtasks||[];

      const obj={id:isNew?uid():it.id, text, done:progress>=100, priority:$('#m_pri').value, progress, category:$('#m_cat').value.trim(), subtasks, createdAt:isNew?nowISO():data.createdAt, updatedAt:nowISO()};

function genMonthSummary(){

  const lines=[];
  lines.push('# '+y+'年'+(m+1)+'月 月度总结');

  lines.push('- 计划任务总数：**'+items.length+'**');
  lines.push('- 已完成：**'+done+'**　完成率：**'+(items.length?Math.round(done/items.length*100):0)+'%**');

function genPassword(len, sym){
  const lower='abcdefghijklmnopqrstuvwxyz', upper=lower.toUpperCase(), num='0123456789', s='!@#$%^&*()-_=+';
  let pool=lower+upper+num; if(sym) pool+=s;
  const arr=new Uint32Array(len); (window.crypto||require('crypto')).getRandomValues(arr);
  let out=''; for(let i=0;i<len;i++) out+=pool[arr[i]%pool.length];
  return out;
}

function renderWeek(){

  view.innerHTML=

    '<div class="card"><pre class="md-pre">'+escapeHtml(md.text)+'</pre></div>';

function buildWeekly(){
  const end=new Date(); const start=new Date(end.getTime()-6*86400000);
  const inRange=iso=>{ const t=new Date(iso).getTime(); return t>=start.getTime() && t<=end.getTime()+86400000; };
  const todos=(Store.get(KEY.todo,[])||[]).filter(t=>t.createdAt&&inRange(t.createdAt));
  const plan=Store.get(KEY.month,{})||{}; let mItems=[];
  Object.keys(plan).forEach(d=>plan[d].forEach(it=>{ if(it.createdAt&&inRange(it.createdAt)||(it.updatedAt&&inRange(it.updatedAt))) mItems.push({date:d, ...it}); }));
  const dev=(Store.get(KEY.dev,[])||[]).filter(d=>d.updatedAt&&inRange(d.updatedAt));
  const net=(Store.get(KEY.net,[])||[]).filter(n=>n.createdAt&&inRange(n.createdAt));
  const know=(Store.get(KEY.know,[])||[]).filter(k=>k.createdAt&&inRange(k.createdAt));
  const L=[];
  L.push('# 工作周报（'+fmtDate(start)+' ~ '+fmtDate(end)+'）');
  L.push('');
  L.push('## 一、今日待办（本周新增 '+todos.length+'）');
  todos.forEach(t=>L.push('- ['+(t.done?'x':' ')+'] '+t.text));
  L.push('');
  L.push('');
  L.push('## 二、月度计划进展（'+mItems.length+'）');
  mItems.forEach(it=>L.push('- '+it.date+' · ['+(isComplete(it)?'x':' ')+'] '+it.text+(it.category?'（'+it.category+'）':'')));
  L.push('');
  L.push('## 三、设备运维（'+dev.length+'）');
  dev.forEach(d=>L.push('- '+escapeHtml(d.deviceName||'')+(d.replacementRecords&&d.replacementRecords.length?('：'+d.replacementRecords.length+' 次更换'):'')));
  L.push('');
  L.push('## 四、网络维护（'+net.length+'）');
  net.forEach(n=>L.push('- '+escapeHtml(n.incidentDate||'')+' · '+escapeHtml(n.cause||'')+'（'+(n.severity==='high'?'严重':n.severity==='low'?'轻微':'一般')+'）'));
  L.push('');
  L.push('## 五、知识沉淀（'+know.length+'）');
  know.forEach(k=>L.push('- '+escapeHtml(k.title||'')));
  L.push('');
  L.push('> 由「个人工作台」自动生成');
  return { range:fmtDate(start)+' ~ '+fmtDate(end), text:L.join('\n') };
}

/* ============================ WebDAV 同步层（坚果云 + 无服务器代理） ============================ */
const SYNC_KEYS=['todayTodos','monthlyPlan','yearlyArchive','ipDevices','encryptedAccounts','encryptedUrls','deviceMaintenance','networkMaintenance','knowledge'];
const SYNC_FOLDER='工作台';
const SYNC_META_KEY='wbSyncMeta'; // { [key]: updatedAt }
const SYNC_KEYSET_KEY='wbSyncKeyset'; // 动态登记的同步 key（新增模块自动纳入）
// 不应同步的本地 key：同步配置(含坚果云密码)、同步元数据、动态集合自身
const SYNC_BLACKLIST=new Set([SYNC_META_KEY, SYNC_KEYSET_KEY, 'webdavConfig']);
// 动态登记：业务代码首次 Store.set(key) 时自动加入同步范围，新增模块无需改此处
function registerSyncKey(k){
  if(SYNC_BLACKLIST.has(k)) return;
  const set=Store.get(SYNC_KEYSET_KEY, []) || [];
  if(!set.includes(k)){ set.push(k); localStorage.setItem(SYNC_KEYSET_KEY, JSON.stringify(set)); }
}
// 当前应同步的全部 key = 初始 10 个 + 动态登记，剔除黑名单
function getSyncKeys(){
  const all=new Set([...(Store.get(SYNC_KEYSET_KEY, [])||[]), ...SYNC_KEYS]);
  SYNC_BLACKLIST.forEach(k=>all.delete(k));
  return [...all];
}
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getHours()+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function getSyncMeta(){ return Store.get(SYNC_META_KEY, {}) || {}; }
function setSyncMeta(m){ Store.set(SYNC_META_KEY, m); }

const SyncStatus={
  set(state, detail){
    const pill=$('#syncPill'), pillText=$('#syncPillText'), nav=$('#navStatText'), panel=$('#syncStatus');
    const map={idle:['off','离线'],syncing:['syncing','同步中…'],success:['ok','已连接'],error:['err','错误'],offline:['off','离线']};
    const [cls,txt]=map[state]||map.idle;
    if(pill){ pill.className='sync-pill '+cls; if(pillText) pillText.textContent=detail? txt+' · '+detail : txt; }
    if(nav){ nav.textContent = detail? (txt+' · '+detail) : txt; }
    if(panel){ panel.textContent = detail? (txt+'：'+detail) : txt; }
  }
};

const Sync={
  cfg:null, timers:{}, pending:[], restoring:false,
  loadCfg(){ try{ this.cfg=JSON.parse(localStorage.getItem('webdavConfig')||'null'); }catch(e){ this.cfg=null; } return this.cfg; },
  isConfigured(){ const c=this.cfg||this.loadCfg(); return !!(c && c.serverUrl && c.username && c.password); },
  authHeader(){ const c=this.cfg; return 'Basic '+btoa(unescape(encodeURIComponent(c.username+':'+c.password))); },
  folderPath(){ const c=this.cfg; return c.serverUrl.replace(/\/+$/,'')+'/dav/'+SYNC_FOLDER; },
  async request(method, path, body, isBinary){
    const c=this.cfg;
    const headers={'Authorization':this.authHeader()};
    if(c.secret) headers['X-Sync-Key']=c.secret;
    if(isBinary!==true) headers['Content-Type']='application/json';
    const init={method, headers};
    if(body!==undefined && !['GET','HEAD','OPTIONS'].includes(method)){
      init.body = (isBinary || typeof body==='string') ? body : JSON.stringify(body);
    }
    return fetch(path, init);
  },
  async testConnection(){
    SyncStatus.set('syncing','测试中');
    try{
      const res=await this.request('HEAD', this.folderPath()+'/__probe__.json');
      if(res.status===401){ SyncStatus.set('error','账号或应用密码错误'); return false; }
      SyncStatus.set('success','上次 '+fmtTime(Date.now())); return true;
    }catch(e){ SyncStatus.set('error','无法连接（'+(e&&e.message||'')+'）'); return false; }
  },
  async uploadData(key, payload){
    const res=await this.request('PUT', this.folderPath()+'/'+key+'.json', payload);
    if(res.status===401) throw new Error('认证失败');
    if(res.status>=400) throw new Error('上传失败 HTTP '+res.status);
    return true;
  },
  async publishSite(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','发布中');
    try{
      const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      const path=this.folderPath()+'/personal-workbench.html';
      const res=await this.request('PUT', path, html, true);
      if(res.status===401) throw new Error('认证失败');
      if(res.status>=400) throw new Error('发布失败 HTTP '+res.status);
      SyncStatus.set('success','已发布 '+fmtTime(Date.now()));
      toast('已发布到云端，刷新 SCF 页面地址即最新版','ok');
    }catch(e){
      SyncStatus.set('error',(e&&e.message)||'发布失败');
      toast('发布失败：'+((e&&e.message)||''),'err');
    }
  },
  async downloadData(key){
    const res=await this.request('GET', this.folderPath()+'/'+key+'.json');
    if(res.status===404) return null;
    if(res.status>=400) throw new Error('下载失败 HTTP '+res.status);
    try{ return await res.json(); }catch(e){ throw new Error('解析失败'); }
  },
  async fileExists(key){
    const res=await this.request('HEAD', this.folderPath()+'/'+key+'.json');
    return res.status===200 || res.status===207;
  },
  async listFiles(){
    try{
      const res=await this.request('PROPFIND', this.folderPath(), '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:resourcetype/><D:getetag/></D:prop></D:propfind>', true);
      if(res.status!==207) return [];
      const txt=await res.text();
      return [...txt.matchAll(/<href>([^<]+)<\/href>/g)].map(m=>decodeURIComponent(m[1])).filter(h=>/\.json$/.test(h));
    }catch(e){ return []; }
  },
  scheduleUpload(key){
    if(this.restoring || !this.isConfigured()) return;
    if(this.timers[key]) clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>this.pushKey(key), 3000);
  },
  async pushKey(key){
    if(!this.isConfigured()) return;
    const meta=getSyncMeta(); const ts=Date.now(); meta[key]=ts; setSyncMeta(meta);
    try{
      SyncStatus.set('syncing');
      await this.uploadData(key, {updatedAt:ts, data:Store.get(key, null)});
      SyncStatus.set('success','上次 '+fmtTime(Date.now()));
    }catch(e){
      SyncStatus.set('error', (e&&e.message)||'错误');
      if(!navigator.onLine || /fetch|network|认证/i.test(e.message||'')) this.pending.push(key);
    }
  },
  async syncAll(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','全量上传');
    try{
      for(const key of getSyncKeys()){
        const meta=getSyncMeta(); const ts=Date.now(); meta[key]=ts; setSyncMeta(meta);
        await this.uploadData(key, {updatedAt:ts, data:Store.get(key, null)});
      }
      SyncStatus.set('success','上次 '+fmtTime(Date.now())); toast('已同步到云端','ok');
    }catch(e){ SyncStatus.set('error', (e&&e.message)||'错误'); toast('同步失败：'+((e&&e.message)||''),'err'); }
  },
  async pullAll(){
    if(!this.isConfigured()) return;
    this.restoring=true; let changed=false;
    try{
      SyncStatus.set('syncing','拉取云端');
      for(const key of getSyncKeys()){
        let cloud; try{ cloud=await this.downloadData(key); }catch(e){ continue; }
        if(!cloud) continue;
        const meta=getSyncMeta(); const localTs=meta[key]||0;
        if(cloud.updatedAt>localTs){
          Store.set(key, cloud.data);
          const m=getSyncMeta(); m[key]=cloud.updatedAt; setSyncMeta(m);
          changed=true;
        }
      }
      SyncStatus.set('success','上次 '+fmtTime(Date.now()));
    }catch(e){ SyncStatus.set('error', (e&&e.message)||'错误'); }
    finally{ this.restoring=false; }
    if(changed){ refreshDashboard(); render(); toast('已从云端合并更新','ok'); }
  },
  async fullSync(){
    if(!this.isConfigured()){ toast('请先保存同步配置','err'); return; }
    SyncStatus.set('syncing','双向同步');
    await this.pullAll();
    await this.syncAll();
  }
};

// 挂钩 Store.set / Store.del：所有模块数据变更后自动防抖上传到坚果云
(function hookStore(){
  const _set=Store.set.bind(Store), _del=Store.del.bind(Store);
  Store.set=function(k,v){ _set(k,v); if(!SYNC_BLACKLIST.has(k)){ registerSyncKey(k); Sync.scheduleUpload(k); } };
  Store.del=function(k){ _del(k); if(!SYNC_BLACKLIST.has(k)) Sync.scheduleUpload(k); };
})();

function initSync(){
  Sync.loadCfg();
  const box=$('#syncBox'), head=$('#syncHead');
  if(head) head.onclick=()=>box.classList.toggle('collapsed');
  if($('#cfgShow')) $('#cfgShow').onclick=()=>{ const p=$('#cfgPass'); p.type = p.type==='password'?'text':'password'; };
  if($('#cfgSave')) $('#cfgSave').onclick=()=>{
    const cfg={ serverUrl:$('#cfgUrl').value.trim(), username:$('#cfgUser').value.trim(), password:$('#cfgPass').value, secret:$('#cfgSecret').value.trim() };
    if(!cfg.serverUrl||!cfg.username||!cfg.password){ toast('请填写完整的服务器地址、账号、应用密码','err'); return; }
    localStorage.setItem('webdavConfig', JSON.stringify(cfg));
    Sync.cfg=cfg; toast('配置已保存','ok'); Sync.testConnection();
  };
  if($('#cfgTest')) $('#cfgTest').onclick=()=>Sync.testConnection();
  if($('#cfgPublish')) $('#cfgPublish').onclick=()=>Sync.publishSite();
  if($('#cfgSync')) $('#cfgSync').onclick=()=>Sync.fullSync();
  if($('#syncBtn')) $('#syncBtn').onclick=()=>Sync.fullSync();
  if(Sync.cfg){ $('#cfgUrl').value=Sync.cfg.serverUrl||''; $('#cfgUser').value=Sync.cfg.username||''; $('#cfgPass').value=Sync.cfg.password||''; $('#cfgSecret').value=Sync.cfg.secret||''; }
  window.addEventListener('online', ()=>{ if(Sync.pending.length){ Sync.pending=[]; Sync.fullSync(); } else SyncStatus.set('success','已恢复'); });
  window.addEventListener('offline', ()=>SyncStatus.set('offline','离线'));
  if(!navigator.onLine) SyncStatus.set('offline','离线');
  if(Sync.isConfigured()){ Sync.testConnection(); Sync.fullSync(); }
  else SyncStatus.set('offline','未配置');
}

/* ============================ 界面主题（风格切换） ============================ */
const THEME_KEY='uiTheme';
function applyTheme(name){
  name=name||'teal';
  document.documentElement.className = (name==='teal') ? '' : ('theme-'+name);
  try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
}
function initTheme(){
  let t='teal'; try{ t=localStorage.getItem(THEME_KEY)||'teal'; }catch(e){}
  applyTheme(t);
  const sel=$('#themeSel'); if(sel){ sel.value=t; sel.onchange=()=>applyTheme(sel.value); }
}
/* 数据迁移：旧「今日聚焦」并入「今日待办」，丢弃聚焦概念 */
function migrateFocusToTodo(){
  try{
    const tasks=Store.get('tasks', null);
    if(Array.isArray(tasks) && tasks.length){
      const todos=Store.get('todayTodos', [])||[];
      const ids=new Set(todos.map(t=>t.id));
      tasks.forEach(t=>{ if(t && t.id && !ids.has(t.id)) todos.push(t); });
      Store.set('todayTodos', todos);
      Store.del('tasks');
    }
  }catch(e){}
}

/* ============================ 初始化 ============================ */
function tickClock(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); $('#clock').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function init(){
  migrateFocusToTodo();
  initTheme();
  buildNav();
  initSync();
  $('#hamburger').onclick=()=>{ const sb=$('#sidebar'); sb.classList.toggle('open'); let bd=$('.backdrop'); if(sb.classList.contains('open')&&!bd){ bd=document.createElement('div'); bd.className='backdrop'; bd.onclick=()=>{ sb.classList.remove('open'); bd.remove(); }; document.body.appendChild(bd); } else if(!sb.classList.contains('open')&&bd){ bd.remove(); } };
  $('#logoutBtn').onclick=()=>logoutMenu();
  function logoutMenu(){
    const body=document.createElement('div');
    body.innerHTML='<div class="warn" style="margin-bottom:10px">选择退出方式：</div>'+
      '<div style="font-size:13px;line-height:1.8;color:var(--ink-2)">'+
      '🔒 <b>锁屏</b>：保留本机所有数据，下次打开需重新输入主密码。<br>'+
      '🧹 <b>清除本机全部数据</b>：删除本浏览器所有本地数据（加密业务数据 + 同步配置）。'+
      '云端已同步的数据可在重设同步后恢复；<b>未同步的改动会丢失</b>。</div>';
    openModal({ title:'退出工作台', body, actions:[
      {label:'取消', onClick:c=>c()},
      {label:'锁屏', primary:true, onClick:c=>{ MasterKey.clear(); c(); location.reload(); }},
      {label:'清除本机数据', danger:true, onClick:c=>{
        c();
        confirmModal('将删除本浏览器所有本地数据且不可撤销。仅当已同步到云端时数据可恢复。确定继续？', {title:'确认清除本机数据', ok:'确认清除'}).then(ok=>{
          if(ok){ try{ localStorage.clear(); sessionStorage.clear(); }catch(e){} location.reload(); }
        });
      }}
    ]});
  }
  tickClock(); setInterval(tickClock, 30000);
  go('home');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

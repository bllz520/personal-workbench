# GitHub Actions：定时从坚果云 WebDAV（经 SCF 代理）拉取最新工作台并部署到 Pages
name: Deploy workbench from WebDAV

on:
  schedule:
    - cron: '*/30 * * * *'      # 每 30 分钟；保守用额度，可改 */15
  workflow_dispatch: {}         # 支持手动触发

permissions:
  contents: write

env:
  ENTRY_FILE: index.html   # 仓库里的入口文件名（与 Pages 设置一致）

jobs:
  pull-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest HTML from WebDAV (via SCF proxy)
        env:
          SCF_URL: ${{ secrets.SCF_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          FOLDER_ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('工作台'))")
          AUTH=$(printf '%s:%s' "$WEBDAV_USER" "$WEBDAV_PASS" | base64 | tr -d '\n')
          URL="${SCF_URL%/}/dav/${FOLDER_ENC}/__site__/personal-workbench.html"
          echo "GET $URL"
          curl -sS -f \
            -H "Authorization: Basic ${AUTH}" \
            -H "X-Sync-Key: ${SYNC_SECRET}" \
            -o /tmp/site.html "$URL"
          echo "downloaded bytes: $(wc -c < /tmp/site.html)"

      - name: Commit if changed
        env:
          ENTRY_FILE: ${{ env.ENTRY_FILE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "$ENTRY_FILE" ] && cmp -s "$ENTRY_FILE" /tmp/site.html; then
            echo "无变化，跳过提交"
            exit 0
          fi
          cp /tmp/site.html "$ENTRY_FILE"
          git add "$ENTRY_FILE"
          git commit -m "deploy: 自动拉取坚果云最新工作台 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
          echo "已提交并推送，Pages 将自动重建"
